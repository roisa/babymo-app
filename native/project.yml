name: BabyMo
options:
  bundleIdPrefix: id.babymo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7VJR9VXX6A
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  BabyMoKit:
    path: ../BabyMoKit

targets:
  # ──────────────────────────── iPhone / iPad app ────────────────────────────
  BabyMo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyMo
      - path: ../ios/App/App/public
        name: WebContent
        type: folder
        buildPhase: resources
    dependencies:
      - package: BabyMoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.babymo.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ──────────────────────────── UI tests (iOS) ───────────────────────────────
  BabyMoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyMoUITests
    dependencies:
      - target: BabyMo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.babymo.app.uitests
        TEST_TARGET_NAME: BabyMo

  # The Apple Watch app target is parked for v1: it displays progress fed by
  # the native ProgressService, which is dormant while the app fronts the web
  # hub — shipping an empty watch app is an App Review rejection risk. Restore
  # the target from git history once the web→native progress bridge exists.

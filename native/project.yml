name: BabyMo
options:
  bundleIdPrefix: id.babymo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  BabyMoKit:
    path: ../BabyMoKit

targets:
  # ──────────────────────────── iPhone / iPad app ────────────────────────────
  BabyMo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyMo
      - path: ../ios/App/App/public
        name: WebContent
        type: folder
        buildPhase: resources
    dependencies:
      - package: BabyMoKit
      - target: BabyMo Watch App
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.babymo.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ──────────────────────────── Apple Watch app ──────────────────────────────
  BabyMo Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BabyMoWatch
    dependencies:
      - package: BabyMoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.babymo.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: id.babymo.app
        INFOPLIST_KEY_CLKComplicationPrincipalClass: ""

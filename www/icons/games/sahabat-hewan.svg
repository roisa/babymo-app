<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="hewan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity=".22"/></filter>
    <clipPath id="sq"><rect width="100" height="100" rx="23"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <ellipse cx="50" cy="8" rx="70" ry="44" fill="url(#sheen)"/>
    <path d="M0 80 Q50 70 100 80 V100 H0Z" fill="#fff" fill-opacity=".22"/>
    <g filter="url(#sh)" fill="#fff">
      <!-- cat head -->
      <path d="M26 40 l4 -16 l10 11 z M58 40 l-4 -16 l-10 11 z"/>
      <circle cx="42" cy="50" r="18"/>
      <!-- heart -->
      <path d="M72 30 c-4 -6 -12 -2 -10 4 c1 4 10 10 10 10 s9 -6 10 -10 c2 -6 -6 -10 -10 -4z" fill="#fff"/>
      <!-- paw -->
      <circle cx="70" cy="70" r="8"/><circle cx="62" cy="60" r="3.4"/><circle cx="69" cy="57" r="3.4"/><circle cx="77" cy="59" r="3.4"/><circle cx="80" cy="66" r="3"/>
    </g>
    <g fill="#C2410C"><circle cx="36" cy="49" r="2.6"/><circle cx="48" cy="49" r="2.6"/><path d="M40 55 h4 l-2 2.4 z"/></g>
    <path d="M38 59 q4 3 8 0" stroke="#C2410C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>

<!doctype html>
<html lang="id"><head>
<script src="../bm-theme.js"></script>
<meta charset="utf-8">
<script>
/* Web-only developer tool (voice clips). In the iOS app
   (Capacitor) it never runs: the microphone is never requested and the
   page only says "Hanya di web / Web only". */
(function(){try{
  var C=window.Capacitor,app=C?(typeof C.isNativePlatform!=='function'||!!C.isNativePlatform()):location.protocol==='capacitor:';
  if(!app)return;
  window.BM_WEB_ONLY=true;
  try{var md=navigator.mediaDevices;if(md)Object.defineProperty(md,'getUserMedia',{value:function(){return Promise.reject(new Error('web only'));},configurable:true});}catch(e){}
  /* swallow the rest of the page as inert text: none of its scripts run */
  document.write('<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><plaintext hidden>');
  var show=function(){
    document.body.innerHTML='<div style="display:flex!important;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:24px;text-align:center;font:800 20px/1.3 Nunito,system-ui,sans-serif">'+
      '<div style="font-size:44px">🌐</div><div>Hanya di web</div><div style="font-size:16px;opacity:.7">Web only</div></div>';};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show);else show();
}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Dengar Suara · Baby Mo</title>
<link rel="icon" href="../icons/ui/sound.svg" type="image/svg+xml"><link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ink:#10231B;--ink2:#4B5F56;--ink3:#7A8B83;--glass:rgba(255,255,255,.78);--hair:rgba(16,35,27,.08);--tint:#12A150;--ar:'Amiri Quran','Amiri','Scheherazade New',serif;
 --bg:radial-gradient(ellipse 90% 45% at 50% -5%,#D4F5E2 0%,transparent 70%),#F1F7F4}
html[data-bm-theme="classic"]{--ink:#EAF5EF;--ink2:#A9BDB3;--ink3:#7F9489;--glass:rgba(28,44,37,.78);--hair:rgba(255,255,255,.08);--tint:#30D158;--bg:radial-gradient(ellipse 90% 45% at 50% -5%,#173B2A 0%,transparent 70%),#0C1712}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-attachment:fixed}
.app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
a.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:var(--glass);border:1px solid var(--hair);color:var(--ink);text-decoration:none;font-weight:800}
h1{font:600 28px/1.15 'Fredoka',sans-serif;margin:14px 2px 4px}
.lead{color:var(--ink2);font-size:14.5px;line-height:1.45;margin:0 2px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:rgba(118,118,128,.14);margin-bottom:10px}
.seg button{border:0;background:none;padding:10px;border-radius:12px;font:800 15px 'Nunito',sans-serif;color:var(--ink2)}
.seg button.on{background:var(--glass);color:var(--ink);box-shadow:0 3px 10px -3px rgba(0,0,0,.15)}
.all{width:100%;height:50px;border:0;border-radius:25px;background:linear-gradient(180deg,#22B862,#0E9447);color:#fff;font:900 16px 'Nunito',sans-serif;margin:4px 0 14px}
h2{font:800 13px 'Nunito',sans-serif;color:var(--ink3);margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid.doa{grid-template-columns:1fr}
.c{position:relative;border:1px solid var(--hair);background:var(--glass);border-radius:18px;padding:10px 8px 8px;text-align:center;cursor:pointer;color:var(--ink);font-family:inherit;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 16px -14px rgba(0,0,0,.4);transition:transform .2s}
.c:active{transform:scale(.96)}
.c .a{font-family:var(--ar);direction:rtl;font-size:32px;line-height:1.6}
.doa .c .a{font-size:22px;line-height:1.9;text-align:right}
.c .h{font-size:11.5px;font-weight:800;color:var(--ink3);line-height:1.2}
.doa .c .h{text-align:left}
.c.play{outline:3px solid #F5B400;outline-offset:1px}
.c.flag::after{content:'⚑';position:absolute;top:4px;left:7px;color:#E5484D;font-size:15px}
.note{color:var(--ink3);font-size:13px;line-height:1.45;margin-top:16px}
.seg button small{display:block;font-size:11px;font-weight:800;color:var(--ink3)}
.seg button{padding:9px 3px;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.grid.lines{grid-template-columns:1fr}
.lines .c{text-align:left;padding:10px 12px 8px}
.lines .c .a.lat{font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;line-height:1.35;padding:2px 0 3px}
.c .a.lat{font-family:'Fredoka','Nunito',sans-serif;direction:ltr;font-size:20px;line-height:1.4;padding:6px 0 2px}
.c.none{opacity:.45;cursor:default}
.c .h{overflow-wrap:anywhere}
.c.none{padding-top:20px}
.c.none::before{content:attr(data-none);position:absolute;top:4px;right:7px;font-size:10px;font-weight:900;color:var(--ink3)}
.empty{color:var(--ink2);font-size:14px;line-height:1.5;padding:14px 4px}
</style></head><body><div class="app">
<a class="back" href="../index.html" id="back"></a>
<h1 id="ttl"></h1>
<p class="lead" id="lead"></p>
<div class="seg" id="seg"></div>
<button class="all" id="all"></button>
<div id="list"></div>
<p class="note" id="flags"></p>
</div>
<script src="../hijaiyah-voice/voice.js"></script>
<script src="../doa-voice/voice.js"></script>
<script src="../voice/manifest.js"></script>
<script src="dengar-data.js"></script>
<script>
/* Listening page for the recorded clips: every row of the clip lists (dengar-data.js), its file from the
   manifests (hijaiyah-voice/voice.js, doa-voice/voice.js, voice/manifest.js). Rows without a clip yet are greyed. */
let EN=false; try{ EN=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('bm_lang'))==='en'; }catch(e){}
document.documentElement.lang=EN?'en':'id';
const L=(id,en)=>EN?en:id;
const D=window.DENGAR||[];
const SECS=[['huruf','🔤',L('Huruf','Letters')],['doa','🤲',L('Doa','Du\'a')],['app','🕌',L('Arab di game','Game Arabic')],['cari','🔍','Cari Baby Mo'],['lines','💬',L('Kalimat','Lines')]];
function fileOf(x){
  if(x.s==='huruf'){ const m=window.HIJ_VOICE; return m&&m[x.t]?'../hijaiyah-voice/'+m[x.t]:null; }
  if(x.s==='doa'){ const m=window.DOA_VOICE; return m&&m[x.t]?'../doa-voice/'+m[x.t]:null; }
  const m=window.BM_VOICE; return m&&m[x.key]?'../voice/'+m[x.key]:null;
}
D.forEach(x=>{x.f=fileOf(x);x.id=x.s+'|'+x.key;});
document.title=L('Dengar Suara · Baby Mo','Listen to the Voices · Baby Mo');
document.getElementById('back').textContent='‹ '+L('Beranda','Home');
document.getElementById('ttl').textContent=L('Dengar Suara','Listen to the Voices');
document.getElementById('lead').textContent=L('Ketuk kartu untuk mendengar. Tekan lama (atau klik kanan) untuk menandai ⚑ suara yang terdengar kurang tepat, lalu beri tahu Claude kartu yang ditandai.',
  'Tap a card to listen. Long-press (or right-click) to flag ⚑ a clip that sounds wrong, then tell Claude which cards you flagged.');
document.getElementById('all').textContent='▶ '+L('Putar semua di bagian ini','Play everything in this section');
let sec='huruf', seq=0, au=new Audio(), flags=new Set();
try{ flags=new Set(JSON.parse(localStorage.getItem('bm_voice_flags')||'[]')); }catch(e){}
try{ const q=new URLSearchParams(location.search).get('s'); if(SECS.some(s=>s[0]===q)) sec=q; }catch(e){}
const seg=document.getElementById('seg'); seg.style.gridTemplateColumns='repeat('+SECS.length+',1fr)';
SECS.forEach(([k,ic,nm])=>{ const b=document.createElement('button'); b.dataset.s=k; const n=D.filter(x=>x.s===k), has=n.filter(x=>x.f).length;
  b.innerHTML='<span></span><small></small>'; b.firstChild.textContent=ic+' '+nm; b.lastChild.textContent=has+' / '+n.length; seg.appendChild(b); });
function render(){const Lst=document.getElementById('list');Lst.innerHTML='';let g=null,grid;
 document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.s===sec));
 const rows=D.filter(x=>x.s===sec);
 if(!rows.some(x=>x.f)){ const p=document.createElement('p'); p.className='empty';
   p.textContent=L(sec==='lines'?'Belum ada rekaman kalimat. Buat dengan: bash tools/voice/cloudshell.sh lines (di Google Cloud Shell).':'Belum ada rekaman di bagian ini. Buat dengan: bash tools/voice/cloudshell.sh ar-XA-Chirp3-HD-Algenib (di Google Cloud Shell).',
     sec==='lines'?'No line clips yet. Make them with: bash tools/voice/cloudshell.sh lines (in Google Cloud Shell).':'No clips in this section yet. Make them with: bash tools/voice/cloudshell.sh ar-XA-Chirp3-HD-Algenib (in Google Cloud Shell).'); Lst.appendChild(p); }
 rows.forEach(x=>{if(x.g!==g){g=x.g;const h=document.createElement('h2');h.textContent=g;Lst.appendChild(h);grid=document.createElement('div');grid.className='grid'+(x.s==='lines'?' lines':rows.some(y=>y.g===g&&y.l==='ar'&&y.t.length>14)?' doa':'');Lst.appendChild(grid);}
  const b=document.createElement('button');b.className='c'+(flags.has(x.id)?' flag':'')+(x.f?'':' none');b.dataset.id=x.id;if(x.f)b.dataset.f=x.f;else b.dataset.none=L('belum ada','not yet');
  b.innerHTML='<div class="a"></div><div class="h"></div>';if(x.l!=='ar')b.firstChild.className='a lat';b.firstChild.textContent=x.t;b.lastChild.textContent=x.h;
  b.onclick=()=>{if(!x.f)return;seq++;play(b)};let t;b.oncontextmenu=e=>{e.preventDefault();flag(b)};b.ontouchstart=()=>{t=setTimeout(()=>flag(b),550)};b.ontouchend=b.ontouchmove=()=>clearTimeout(t);grid.appendChild(b);});
 showFlags();}
function play(b,done){document.querySelectorAll('.c.play').forEach(x=>x.classList.remove('play'));b.classList.add('play');b.scrollIntoView({block:'nearest',behavior:'smooth'});
 au.pause();au=new Audio(b.dataset.f);au.onended=()=>{b.classList.remove('play');done&&done()};au.onerror=()=>{b.classList.remove('play');done&&done()};au.play().catch(()=>done&&done());}
function flag(b){const f=b.dataset.id;flags.has(f)?flags.delete(f):flags.add(f);b.classList.toggle('flag');try{localStorage.setItem('bm_voice_flags',JSON.stringify([...flags]));}catch(e){}showFlags();}
function showFlags(){const n=D.filter(x=>flags.has(x.id));document.getElementById('flags').textContent=n.length?(L('Ditandai: ','Flagged: ')+n.map(x=>x.t+' ('+String(x.h).split(' — ')[0]+')').join(' · ')):'';}
document.getElementById('all').onclick=()=>{const my=++seq,cards=[...document.querySelectorAll('.c[data-f]')];let i=0;const nx=()=>{if(my!==seq||i>=cards.length)return;play(cards[i++],()=>setTimeout(nx,350));};nx();};
seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{sec=b.dataset.s;seq++;au.pause();render();});
render();
</script></body></html>

<script src="bm-fit.js"></script>
<script src="i18n/dua.js"></script>
<script src="bm-i18n.js"></script>
<script src="voice/manifest.js"></script>

<meta name="description" content="Perjalanan doa sehari bersama Baby Mo: buka kartu bergambar dan cocokkan setiap momen dengan doanya.">
<title>Dua Journey — Game Mencocokkan Doa untuk Anak | Baby Mo</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ═════ Dua Journey v2 — a child's day as a path of memory-card stops.
   Every rule here applies to BOTH themes: the default values are the dark
   ("classic") look, light tweaks are scoped to html[data-bm-theme="bright"].
   (bm-theme.js switches <style id="bm-bright…"> off in dark mode, so nothing
   that both themes need lives in such a block.) ═════ */
:root{
  --bg:#0A2118;--ink:#F2F7F2;--ink2:#B4CBBE;--line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--sheet:#13291F;
  --gold:#FFD874;--gold-ink:#FFE08A;--green:#1FA971;--green-lt:#3FD08C;
  --pill-bg:rgba(255,216,116,.18);--pill-ink:#FFE08A;
  --paper1:#173D2C;--paper2:#0F2A1E;--paper-line:rgba(255,216,116,.5);--paper-ink:#F2F7F2;--paper-ink2:#BCD3C6;--arabic:#FFE08A;
  --lab-bg:rgba(10,30,22,.82);--lab-ink:#F2F7F2;
}
html[data-bm-theme="bright"]{
  --bg:#F2F6FC;--ink:#152230;--ink2:#4A5A6C;--line:rgba(21,34,48,.10);
  --glass:rgba(255,255,255,.9);--glass2:#fff;--sheet:#fff;
  --gold:#F08C00;--gold-ink:#9A5B00;--green:#12A15A;--green-lt:#2DC76D;
  --pill-bg:#FFE58A;--pill-ink:#6B4000;
  --paper1:#FFFFFF;--paper2:#FFF4DA;--paper-line:#F5C04A;--paper-ink:#152230;--paper-ink2:#4A5A6C;--arabic:#0B6B3A;
  --lab-bg:rgba(255,255,255,.94);--lab-ink:#152230;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);position:relative;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 20% 8%,rgba(31,169,113,.30),transparent 70%),
    radial-gradient(ellipse 65% 50% at 85% 18%,rgba(91,198,232,.15),transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 108%,rgba(224,184,77,.12),transparent 70%),
    linear-gradient(180deg,#0C2A20 0%,#0A2118 55%,#081B14 100%);}
button{font-family:inherit;color:inherit;}
.ar{font-family:'Scheherazade New',serif;direction:rtl;}

/* ── screens ── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;}
.screen.active{display:flex;}
@media(min-width:760px){.screen:not(#gameScreen){max-width:520px;margin:0 auto;}body{background:#06100A;}}
html[data-bm-theme="bright"] body{background:#F2F6FC;}

/* ── iOS-style du'a icons (same set as Doa Harian) ── */
.di{--c1:#FFC94D;--c2:#FF8A3D;--k:#B4410E;position:relative;display:inline-grid;place-items:center;width:var(--s,60px);height:var(--s,60px);border-radius:calc(var(--s,60px)*.29);flex:0 0 auto;
  background:linear-gradient(145deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.10),0 8px 16px -9px var(--c2),0 2px 4px -2px rgba(20,30,60,.25);overflow:hidden;isolation:isolate}
/* glossy sheen across the top + a thin light rim (as in icons/games/*.svg) */
.di::before{content:'';position:absolute;left:-20%;right:-20%;top:-52%;height:96%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));z-index:0;pointer-events:none}
.di::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),inset 0 1.5px 0 rgba(255,255,255,.45);z-index:2;pointer-events:none}
.di svg{position:relative;z-index:1;width:62%;height:62%;overflow:visible;filter:drop-shadow(0 1px 0 rgba(0,0,0,.10)) drop-shadow(0 2px 1.5px rgba(0,0,0,.14))}
.di .w{fill:url(#djW)}.di .ws{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.di .k{fill:var(--k)}.di .ks{fill:none;stroke:var(--k);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.di .y{fill:url(#djY)}
/* drawn UI icons (see UI in the script) */
.ui{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.24em;flex:0 0 auto;overflow:visible;}
.di-pagi{--c1:#FFD25A;--c2:#FF7E3B;--k:#B4410E}
.di-siang{--c1:#5FDBF2;--c2:#2A86E0;--k:#1A5A9E}
.di-sore{--c1:#FF9C86;--c2:#B05FE0;--k:#8A2F9E}
.di-malam{--c1:#8E95FF;--c2:#4436C4;--k:#352A9E}
.di-juara{--c1:#FFE066;--c2:#F59E0B;--k:#9A5B00}

/* ════ JOURNEY MAP ════ */
/* scene colours: default = dark ("classic") night look, bright = sunny day */
:root{
  --sky-a:#0B2436;--sky-b:#0F2E2A;--sky-c:rgba(10,33,24,0);
  --cloud:rgba(255,255,255,.10);--cloud-sh:rgba(255,255,255,0);
  --hill0:#123530;--hill1:#17402F;--hill2:#1D5038;--hill3:#123526;--fg1:#22593D;--fg2:#1A4A31;
  --bush1:#2A6B40;--bush2:#1B4D2E;--fl1:#DDE6F5;--fl2:#FFD35C;--fl3:#E58FB0;--glow:rgba(255,214,110,.20);--glow2:rgba(120,170,255,.10);
  --gold:#F5C542;--wall-sh:#16222A;
  --dome1:#2E6F8F;--dome2:#18465E;--wall1:#2A3B44;--wall2:#1C2A31;--win:#FFD35C;
  --card:rgba(255,255,255,.08);--card-bd:rgba(255,255,255,.14);--card-sh:0 14px 30px -18px rgba(0,0,0,.8);
  --ttl1:#FFE58A;--ttl2:#FFC23A;--ttl3:#F59E0B;--ttl-ex:#9A5200;--ttl-ol:#FFF8E6;
  --rib1:#FFE795;--rib2:#F6C445;--rib-ink:#4A2E00;
  --gr0:#245A3E;--gr1:#1F4F37;--gr2:#1B4632;--gr3:#2B3C43;--gr4:#212A4C;--gr5:#151A3E;
  --hl:rgba(255,255,255,.06);--tr1:#4E9A57;--tr2:#24603A;--trunk:#6B4A2E;
  --road-e:rgba(255,236,196,.20);--road:rgba(255,240,210,.26);--road-d:rgba(255,255,255,.75);
  --sun:#FFD25A;--sun2:#FFB21E;--house:#E9DCC4;--house2:#CDBB9C;--roof1:#F2836B;--roof2:#C94F3D;--hwin:#FFD35C;
  --pill:rgba(10,30,22,.78);--pill-ink:#F2F7F2;--pip-bg:rgba(10,30,22,.55);
}
html[data-bm-theme="bright"]{
  --sky-a:#9FD6FF;--sky-b:#D4EEFF;--sky-c:rgba(242,246,252,0);
  --cloud:#fff;--cloud-sh:rgba(120,170,220,.25);
  --hill0:#CBEBB0;--hill1:#A9DE7C;--hill2:#7FCB5B;--hill3:#5DB646;--fg1:#8FD565;--fg2:#6CC24C;
  --bush1:#62C24A;--bush2:#3E9F3B;--fl1:#fff;--fl2:#FFD84A;--fl3:#FF8FB1;--glow:rgba(255,241,170,.95);--glow2:rgba(255,255,255,.55);
  --gold:#F5B82E;--wall-sh:#D9C9A8;
  --dome1:#5BB4FF;--dome2:#1F6FD8;--wall1:#FFFDF6;--wall2:#E8DCC4;--win:#2F6FB8;
  --card:#fff;--card-bd:rgba(21,34,48,.06);--card-sh:0 14px 30px -16px rgba(40,80,140,.45);
  --ttl1:#FFB43C;--ttl2:#FF7F14;--ttl3:#F05A06;--ttl-ex:#B84500;--ttl-ol:#FFFFFF;
  --gr0:#D7F0A4;--gr1:#BDE68A;--gr2:#A5DA72;--gr3:#BCD58A;--gr4:#7C86C8;--gr5:#3E3F94;
  --hl:rgba(255,255,255,.22);--tr1:#8EE05A;--tr2:#3DA845;--trunk:#9A6A40;
  --road-e:#EAD3A1;--road:#FFF2D4;--road-d:#fff;
  --sun:#FFE15A;--sun2:#FFB21E;--house:#FFF6E6;--house2:#F0DFC2;--roof1:#FF8F73;--roof2:#E0583F;--hwin:#69B6FF;
  --pill:#fff;--pill-ink:#152230;--pip-bg:rgba(255,255,255,.75);
}
@media(min-width:760px){#mapScreen{max-width:none!important;}}
.top-scene{--moH:clamp(218px,60vw,262px);--colw:460px;position:relative;isolation:isolate;width:calc(100% + 32px);margin:calc(-12px - env(safe-area-inset-top)) -16px 0;padding:calc(12px + env(safe-area-inset-top)) 16px 82px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.sky,.fg,.mo-big{position:absolute;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent 100%);}
.sky{inset:0;z-index:-3;overflow:hidden;background:radial-gradient(circle 170px at calc(max(16px,50% - var(--colw)/2) + 50px) 34%,var(--glow) 0,transparent 100%),radial-gradient(ellipse 70% 40% at 70% 18%,var(--glow2) 0,transparent 70%),linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 72%);}
.sky svg,.fg svg{position:absolute;display:block;}
.sky .cl{fill:var(--cloud);filter:drop-shadow(0 4px 4px var(--cloud-sh));}
.sky .c1{left:-2%;top:calc(46% + env(safe-area-inset-top));width:70px;opacity:.95;animation:drift 14s ease-in-out infinite alternate;}
.sky .c2{left:36%;top:calc(2px + env(safe-area-inset-top));width:84px;opacity:.9;animation:drift 18s ease-in-out infinite alternate-reverse;}
.sky .c3{right:-1%;top:calc(30% + env(safe-area-inset-top));width:58px;opacity:.85;animation:drift 16s ease-in-out infinite alternate;}
.sky .c4{left:58%;top:calc(52% + env(safe-area-inset-top));width:46px;opacity:.55;animation:drift 20s ease-in-out infinite alternate-reverse;}
@keyframes drift{to{transform:translateX(14px)}}
.sky .stz{left:0;top:0;width:100%;height:70%;}
html[data-bm-theme="bright"] .sky .stz{display:none;}
.sky .hills{left:0;bottom:0;width:100%;height:96px;}
.sky .mosque{right:max(4px,calc(50% - var(--colw)/2 - 10px));bottom:20px;width:clamp(104px,29vw,140px);height:auto;filter:drop-shadow(0 6px 6px rgba(0,40,0,.18));}
.mo-big{left:calc(max(16px,50% - var(--colw)/2) - 8px);top:0;bottom:14px;width:calc(var(--moH)*.5);overflow:hidden;z-index:-2;}
.mo-big img{position:absolute;left:calc(var(--moH)*-.25);top:calc(68px + env(safe-area-inset-top) - var(--moH)*.135);width:var(--moH);height:var(--moH);max-width:none;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,40,80,.28));animation:mobob 3.4s ease-in-out infinite;transform-origin:50% 90%;}
@keyframes mobob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.fg{inset:0;z-index:-1;overflow:hidden;}
html:not([data-bm-theme="bright"]) .mo-big img{filter:drop-shadow(0 0 14px rgba(255,214,110,.22)) drop-shadow(0 8px 10px rgba(0,0,0,.35));}
.fg .fgh{left:0;bottom:0;width:100%;height:58px;}
.fg .bl{left:calc(max(16px,50% - var(--colw)/2) - 26px);bottom:4px;width:clamp(170px,48vw,210px);height:auto;}
.fg .br{right:max(0px,calc(50% - var(--colw)/2 - 24px));bottom:4px;width:clamp(120px,34vw,150px);height:auto;}
.fg .bm{left:50%;bottom:6px;width:90px;margin-left:-30px;height:auto;}
.m-top{flex:0 0 auto;width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:16px;font-weight:900;color:var(--ink);text-decoration:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;white-space:nowrap;box-shadow:0 8px 18px -12px rgba(0,0,0,.6);}
html[data-bm-theme="bright"] .chip{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.9);box-shadow:0 8px 18px -10px rgba(40,90,150,.45);}
.chip:active{transform:scale(.96);}
.chip b{color:var(--gold-ink);}
/* back to the hub: the soft round-cornered pill the refreshed games use (Wudhu, Dreamtime) */
.hub-btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 14px;border-radius:23px;text-decoration:none;font:800 16px/1 'Fredoka','Nunito',sans-serif;white-space:nowrap;cursor:pointer;
  background:rgba(255,255,255,.08);color:#F0E8D8;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .26s cubic-bezier(.34,1.56,.64,1);}
html[data-bm-theme="bright"] .hub-btn{background:rgba(255,255,255,.92);color:#152230;box-shadow:0 8px 20px -12px rgba(30,80,140,.5),inset 0 1px 0 #fff;}
.hub-btn svg{width:21px;height:21px;flex:none;}
.hub-btn:active{transform:scale(.94);}
.chip .ui{width:22px;height:22px;margin-right:2px;filter:drop-shadow(0 2px 2px rgba(200,120,0,.3));}
.hero{position:relative;flex:0 0 auto;width:100%;max-width:460px;display:flex;align-items:center;margin:6px 0 0;padding-left:calc(var(--moH)*.34);min-height:118px;}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}
.hero-tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
.hero-t{position:relative;z-index:0;isolation:isolate;display:inline-block;padding-right:.62em;font-size:clamp(31px,9vw,48px);font-weight:900;line-height:1.08;letter-spacing:-.025em;white-space:nowrap;}
.hero-t .tt{position:relative;z-index:0;display:inline-block;background:linear-gradient(180deg,var(--ttl1) 8%,var(--ttl2) 52%,var(--ttl3) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1.5px 0 rgba(255,255,255,.35));}
.hero-t::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;-webkit-text-fill-color:var(--ttl-ol);color:var(--ttl-ol);-webkit-text-stroke:.2em var(--ttl-ol);paint-order:stroke fill;filter:drop-shadow(0 .06em 0 var(--ttl-ex)) drop-shadow(0 .1em .12em rgba(80,30,0,.35));}
.hero-t .moon{position:absolute;right:-.06em;top:-.18em;width:.84em;height:.84em;filter:drop-shadow(0 3px 3px rgba(150,90,0,.35));animation:twk 3.2s ease-in-out infinite;}
.hero-s{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,var(--rib1),var(--rib2));color:var(--rib-ink);font-size:clamp(12.5px,3.5vw,16px);font-weight:900;line-height:1.25;max-width:100%;text-wrap:balance;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(190,120,0,.25),0 8px 14px -8px rgba(190,120,0,.7);}

.mode{position:relative;z-index:1;flex:0 0 auto;width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:26px;background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--card-sh);margin:-14px 0 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.mode button{border:0;background:transparent;border-radius:20px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;transition:background .2s,transform .15s;}
.mode button:active{transform:scale(.97);}
.mode b{display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:900;white-space:nowrap;}
.mode b .ui{width:26px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
.mode small .ui-swap{width:1.05em;height:1.05em;margin:0 3px;vertical-align:-.18em;opacity:.75;}
.mode small{font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap;}
.mode button.on{background:linear-gradient(180deg,#3FD88A 0%,#1FB46A 55%,#14975A 100%);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,70,35,.25),0 10px 18px -10px rgba(20,150,90,.95);text-shadow:0 1px 1px rgba(0,60,30,.35);}
.mode button.on small{color:#EAFFF3;}
@media(max-width:380px){.mode b{font-size:15.5px}.mode small{font-size:11.5px}}

/* Du'a of the day — one compact row under the map */
.dod{position:relative;flex:0 0 auto;width:100%;max-width:460px;margin:14px 0 0;padding:9px 10px 9px 9px;border-radius:22px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--card-sh);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.dod[hidden]{display:none;}
.dod-art{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:16px;overflow:hidden;background:#BFE6FF;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 6px 12px -8px rgba(0,0,0,.5);}
.dod-art svg.sc{position:absolute;inset:0;width:100%;height:100%;}
.dod-art img{position:absolute;right:-4%;bottom:0;height:84%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(30,40,70,.3));}
.dod-art.fam{background:linear-gradient(180deg,#4A4FA8,#2A2C6E);}
.dod-art.fam img{height:92%;bottom:-3px;}
.dod-art.fam img.u{left:-4px;right:auto;height:86%;}
.dod-art.fam img.a{right:-6px;}
.dod-art.fam .ui{position:absolute;left:50%;top:3px;width:15px;height:15px;margin-left:-7px;}
.dod-tx{flex:1;min-width:0;margin:0 2px 0 3px;}
.dod-k{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;}
.dod-k .ui{width:17px;height:17px;margin:-2px 0;}
.dod-t{font-size:15px;font-weight:900;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dod-p{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;}
.dod-p .ui{width:14px;height:14px;}
.dod-p span{overflow:hidden;text-overflow:ellipsis;}
.dod-p b{color:var(--gold-ink);}
.dod-read,.dod-play{flex:0 0 auto;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;text-decoration:none;font:900 14.5px/1 'Nunito',sans-serif;transition:transform .2s;}
.dod-read{width:44px;background:rgba(63,208,140,.12);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(63,208,140,.6);}
html[data-bm-theme="bright"] .dod-read{background:#F0FBF4;color:#0E3B26;box-shadow:inset 0 0 0 1.5px #9FE3BF;}
.dod-read .ui{width:24px;height:24px;}
.dod-play{width:44px;background:linear-gradient(180deg,#3FD88A 0%,#1FB46A 55%,#14975A 100%);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,70,35,.25),0 8px 14px -8px rgba(20,150,90,.9);}
.dod-play .ui{width:20px;height:20px;margin-left:2px;filter:drop-shadow(0 1px 1px rgba(0,60,30,.35));}
.dod-read:active,.dod-play:active{transform:scale(.94);}

/* the path through the day — a landscape from sunrise to night */
.journey{position:relative;width:100%;max-width:460px;border-radius:32px;overflow:hidden;flex:0 0 auto;background:linear-gradient(180deg,var(--sky-a),var(--gr1));
  box-shadow:inset 0 0 0 1px var(--line),0 18px 36px -24px rgba(0,0,0,.7);}
html[data-bm-theme="bright"] .journey{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 18px 36px -20px rgba(40,90,150,.55);}
.journey svg.land,.journey svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.node{position:absolute;width:140px;margin-left:-70px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;z-index:2;}
.node .ic{position:relative;}
.node .di{--s:76px;transition:transform .2s;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 6px rgba(0,0,0,.14),0 10px 18px -8px var(--c2),0 3px 5px -2px rgba(20,30,60,.35);}
.node:active .di{transform:scale(.92);}

/* Mo peeks out from behind the result card: render 1, upper body only (head to chest),
   rising from behind the card and gently bobbing. The card that follows sits on top. */
.mo-peek{position:relative;z-index:0;display:block;width:var(--pw,230px);height:calc(var(--pw,230px)*.53);margin:0 auto calc(var(--pov,18px)*-1);overflow:hidden;pointer-events:none;flex:none}
/* the cut at Mo's waist dissolves behind the card instead of showing as a hard line through glass cards */
.mo-peek{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - var(--pov,18px) - 6px),rgba(0,0,0,.35) calc(100% - var(--pov,18px)*.45),transparent 100%);mask-image:linear-gradient(180deg,#000 calc(100% - var(--pov,18px) - 6px),rgba(0,0,0,.35) calc(100% - var(--pov,18px)*.45),transparent 100%)}
span.mo-peek>img{position:absolute!important;left:0!important;top:-22.6%!important;width:100%!important;height:auto!important;max-width:none!important;margin:0!important;object-fit:contain!important;filter:drop-shadow(0 6px 14px rgba(20,30,80,.22))!important;animation:moPeekUp .85s cubic-bezier(.3,1.45,.5,1) .15s both,moPeekBob 2.8s ease-in-out 1.1s infinite!important;transform-origin:50% 100%}
.mo-peek+*{position:relative;z-index:1}
@keyframes moPeekUp{from{transform:translateY(80%)}to{transform:translateY(0)}}

// ════════════ SCENE ART (Doa Harian's illustrated scenes) ════════════
// doa-scenes.js only exposes renderDoaScene(id) into a #sceneCard header, so
// render each scene once into a hidden stand-in and keep the SVG + pose.
const SCENES = {};
(function(){
  const box = document.createElement('div');
  box.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
  box.innerHTML='<div id="sceneCard"><div id="sceneBg"></div><img id="sceneMo" alt=""></div>';
  (document.body||document.documentElement).appendChild(box);
  DUAS.forEach(d=>{
    try{
      if(window.renderDoaScene && renderDoaScene(d.id)){
        const svg=$('sceneBg').innerHTML, m=svg.match(/^<svg[^>]*>([\s\S]*)<\/svg>$/);
        SCENES[d.id]={inner:m?m[1]:svg, src:$('sceneMo').getAttribute('src')||'', flip:$('sceneMo').getAttribute('data-flip')==='1'};
      }
    }catch(e){}
  });
  box.remove();
})();
const WAKTU_BG = {pagi:['#FFE2B8','#FFC98A'],siang:['#CFF0FF','#8FD3F5'],sore:['#FFD3C2','#E7A6D9'],malam:['#5A5FB8','#2A2C6E']};
let sceneSeq = 0;
function sceneSvg(d, vb){
  const s = SCENES[d.id], k = ++sceneSeq;
  let inner;
  if(s) inner = s.inner.replace(/id="(ds\w+)"/g,'id="$1_'+k+'"').replace(/url\(#(ds\w+)\)/g,'url(#$1_'+k+')');
  else { // a du'a without a drawn scene yet: soft sky + its emoji
    const c = WAKTU_BG[d.waktu]||WAKTU_BG.siang, fx=(ART[d.id]&&ART[d.id].fx)||200;
    inner = '<defs><linearGradient id="fb'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs>'
      +'<rect width="400" height="180" fill="url(#fb'+k+')"/><rect y="146" width="400" height="34" fill="#E8C99A"/>'
      +'<text x="'+fx+'" y="118" font-size="84" text-anchor="middle">'+esc(d.emoji||'🤲')+'</text>';
  }
  return '<svg class="sc" viewBox="'+(vb||(s?'0 -64 400 180':'0 0 400 180'))+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+inner+'</svg>';
}
const poseOf = d=>((SCENES[d.id]&&SCENES[d.id].src)||'baby-mo-poses/baby-mo-yes.webp')+'" style="'+(SCENES[d.id]&&SCENES[d.id].flip?'scale:-1 1':'');
// crop window of a scene for a box of aspect a (=w/h), keeping the du'a's prop in view
function cropFor(d, a){
  const fx=(ART[d.id]&&ART[d.id].fx)||200;
  const y0=SCENES[d.id]?-64:0;   // the drawn scenes are taller now (y -120…180): frame the props, not the floor
  if(a>=400/180) return '0 '+y0+' 400 180';
  const vw=Math.max(60,180*a), x0=Math.min(400-vw,Math.max(0,fx-vw*.42));
  return x0.toFixed(1)+' '+y0+' '+vw.toFixed(1)+' 180';
}

// ════════════ SAVE (records + progress) ════════════
const KEY='bm_dua_journey_v2', OLD_KEY='bm_dua_game_v1';
function load(){
  let r=null;
  try{ r=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!r||typeof r!=='object'||!r.stops) r={v:2,mode:null,sound:true,stops:{}};
  if(!r.mig){
    // v1 had 3 levels (Easy / Medium / Amazing) of read-and-match cards: carry
    // each finished level over as the matching first stops, in the reading mode.
    try{
      const o=JSON.parse(localStorage.getItem(OLD_KEY));
      if(o&&o.levels){
        ['pagi','berangkat','belajar'].forEach((sid,i)=>{
          const x=o.levels[i+1]; if(!x||!x.stars) return;
          const st=r.stops[sid]=r.stops[sid]||{}, cur=st.big;
          if(!cur||cur.stars<x.stars) st.big={stars:Math.min(3,x.stars|0),bestMoves:cur?cur.bestMoves:null,bestTime:cur?cur.bestTime:null,perfect:!!(x.perfect||(cur&&cur.perfect)),plays:(x.plays|0)+(cur?cur.plays|0:0)};
        });
        if(!r.mode) r.mode='big';
      }
    }catch(e){}
    r.mig=1; save(r);
  }
  if(r.mode!=='little'&&r.mode!=='big') r.mode='little';
  return r;
}
function save(r){ try{ localStorage.setItem(KEY,JSON.stringify(r)); }catch(e){} }
let R = load();
const recOf = (sid,mode)=>(R.stops[sid]||{})[mode]||null;
const bestStars = sid=>Math.max(...['little','big'].map(m=>(recOf(sid,m)||{}).stars||0));
const doneStop = i=>bestStars(STOPS[i].id)>0;
function furthest(){ let f=-1; STOPS.forEach((s,i)=>{ if(doneStop(i)) f=i; }); return f; }
const unlocked = i=>i<=furthest()+1;

// ════════════ DU'A OF THE DAY (same formula as Doa Harian's dodDua) ════════════
function todayDua(){ const t=new Date(), n=Math.floor(new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime()/864e5); return DUAS[((n*5)%DUAS.length+DUAS.length)%DUAS.length]; }
function poolOf(i){ const out=[]; for(let k=0;k<=i;k++) STOPS[k].learn.forEach(id=>{ if(DUA[id]&&out.indexOf(id)<0) out.push(id); }); if(!STOPS[i].learn.length) DUAS.forEach(d=>{ if(out.indexOf(d.id)<0) out.push(d.id); }); return out; }
function hasToday(i){ const t=todayDua().id, s=STOPS[i], pool=poolOf(i); if(pool.indexOf(t)<0) return false; return s.learn.indexOf(t)>=0 || Math.min(s.pairs,pool.length)>s.learn.length; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function setFor(i){
  const s=STOPS[i], pool=poolOf(i), fresh=s.learn.filter(id=>DUA[id]);
  const set=fresh.concat(shuffle(pool.filter(id=>fresh.indexOf(id)<0))).slice(0,Math.min(s.pairs,pool.length));
  const t=todayDua().id;
  if(pool.indexOf(t)>=0&&set.indexOf(t)<0) for(let j=set.length-1;j>=0;j--) if(fresh.indexOf(set[j])<0){ set[j]=t; break; }
  return set;
}

function drawRoad(){

  const f=furthest(); let dd='';
  if(f>=0){ dd='M'+P[0][0]+' '+(TOP-22)+' L'+P[0][0]+' '+P[0][1]; for(let i=1;i<=Math.min(f+1,P.length-1);i++) dd+=seg(P[i-1],P[i]); }

// Feet on the road, 60% of the way down the stretch that leads into the stop, facing
// the tile (the walking pose faces right, so he is mirrored when the tile is to his
// left). Where there is no long stretch to walk (the first stop, the last one in
// the middle) he waits on the grass right beside the tile instead.
function placeMo(P,W){
  const m=$('moHere'), cur=+$('journey').dataset.cur||0; if(!m) return;
  let x,y;
  if(cur>0&&Math.abs(P[cur][0]-P[cur-1][0])>W*.3){
    const a=P[cur-1], b=P[cur], t=.6, u=1-t, k=GAP*.6;
    const bz=(p0,p1,p2,p3)=>u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3;
    x=bz(a[0],a[0],b[0],b[0]); y=bz(a[1],a[1]+k,b[1]-k,b[1]);
  } else { x=P[cur][0]+(P[cur][0]<=W/2?100:-100); y=P[cur][1]+40; }
  m.style.left=x.toFixed(1)+'px'; m.style.top=y.toFixed(1)+'px';
  m.classList.toggle('flip',P[cur][0]<x);
}

function tapStop(i){
  if(!unlocked(i)){ try{ BabyMo.sfx&&BabyMo.sfx('wrong'); }catch(e){} toastLock(i); return; }
  const s=STOPS[i], pool=poolOf(i), n=Math.min(s.pairs,pool.length), rec=recOf(s.id,R.mode);
  const fresh=s.learn.filter(id=>DUA[id]).map(id=>DUA[id]);
  const rev=pool.filter(id=>s.learn.indexOf(id)<0).map(id=>DUA[id]);
  let h='<div class="sh-top">'+stopIcon(s)+'<div><div class="sh-k">'+L('Pemberhentian ','Stop ')+(i+1)+L(' dari ',' of ')+STOPS.length+'</div>'
    +'<div class="sh-t">'+esc(T2(s.name))+'</div><div class="sh-m">'+n+L(' doa · ',' du\'as · ')+(n*2)+L(' kartu',' cards')+'</div></div></div>';
  if(fresh.length){
    h+='<div class="sh-l">'+ui('sparkle')+L('Doa baru di sini:','New du\'as here:')+'</div><div class="sh-pics">'
      +fresh.map(d=>'<div class="sh-pic"><div class="ph">'+sceneSvg(d,cropFor(d,1.55))+'<img src="'+poseOf(d)+'" alt=""></div><span>'+esc(label(d))+'</span></div>').join('')+'</div>';
  }
  if(rev.length){
    h+='<div class="sh-l">'+ui('replay')+(fresh.length?L('Plus doa yang sudah dipelajari:','Plus du\'as you already know:'):L('Semua doa sepanjang hari, campur!','Every du\'a of the day, all mixed up!'))+'</div><div class="sh-rev">'+rev.map(duaIcon).join('')+'</div>';
  }
  h+='<div class="sh-rec">'+(rec?pips(rec.stars,3,20)+(rec.bestMoves!=null?'<span>'+ui('steps')+rec.bestMoves+' · '+ui('timer')+fmtT(rec.bestTime)+'</span>':'')+(rec.perfect?'<span>'+ui('medal')+L('Tanpa Salah','No Misses')+'</span>':''):'<span>'+L('Belum dimainkan — ayo coba!','Not played yet — give it a go!')+'</span>')+'</div>'
    +'<button class="sh-go" type="button">'+ui('play')+L('Ayo Main! Bismillah','Let\'s Play! Bismillah')+'</button>'
    +'<button class="sh-x" type="button">'+L('Nanti saja','Maybe later')+'</button>';
  $('sheet').innerHTML=h;

  $('sheet').querySelector('.sh-x').addEventListener('click',closeSheet);
}

// ════════════ SPEECH (device Arabic voice; started from the tap for iOS) ════════════
let arVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); arVoice=v.find(x=>x.lang==='ar-SA')||v.find(x=>/^ar/i.test(x.lang))||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function soundOn(){ return R.sound!==false && !(window.BabyMo&&BabyMo.isMuted&&BabyMo.isMuted()); }
function say(text){
  if(!soundOn()||!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ar-SA'; u.rate=.6; u.pitch=1; if(arVoice) u.voice=arVoice; speechSynthesis.speak(u); }catch(e){}
}
function hush(){ try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} }
function sfx(n){ try{ window.BabyMo&&BabyMo.sfx&&BabyMo.sfx(n); }catch(e){} }
function paintSound(){ $('gSound').innerHTML=ui(R.sound!==false?'sound':'mute'); }
$('gSound').addEventListener('click',()=>{ R.sound=R.sound===false; save(R); paintSound(); if(R.sound===false) hush(); });

// ════════════ GAME ════════════
let G=null, ticker=null;
function startStop(i){
  R=load();
  const s=STOPS[i], ids=setFor(i);
  G={i, s, mode:R.mode, ids, open:[], got:0, moves:0, misses:0, secs:0, lock:false, today:todayDua().id, bonus:false, rvOpen:false};
  $('gTitle').innerHTML=stopIcon(s)+'<span>'+esc(T2(s.name))+'</span>';
  $('gMoves').textContent='0'; $('gTime').textContent='0:00'; paintSound();
  $('tray').innerHTML=ids.map(id=>icon(id,DUA[id].waktu,' data-k="'+id+'"')).join('');
  const cards=[]; ids.forEach(id=>{ cards.push({id,face:'pic'}); cards.push({id,face:G.mode==='big'?'dua':'pic'}); });
  shuffle(cards);
  const grid=$('grid'); grid.className='grid w-'+s.waktu;
  const medal='<svg viewBox="0 0 40 40"><path d="M23 6.5a14 14 0 1 0 11 22.6A11.2 11.2 0 0 1 23 6.5z" fill="#F5B400"/><path d="M28.5 11.5l1.4 2.9 3.2.5-2.3 2.2.5 3.2-2.8-1.5-2.8 1.5.5-3.2-2.3-2.2 3.2-.5z" fill="#FF8A3D"/></svg>';
  const sp='<svg class="sp a" viewBox="-10 -10 20 20"><path d="M0-10C1.2-2.4 2.4-1.2 10 0 2.4 1.2 1.2 2.4 0 10-1.2 2.4-2.4 1.2-10 0-2.4-1.2-1.2-2.4 0-10z"/></svg>';
  grid.innerHTML=cards.map((c,n)=>{
    const d=DUA[c.id];
    const front=c.face==='pic'
      ? '<div class="face front pic">'+sceneSvg(d)+'<img class="mo" src="'+poseOf(d)+'" alt="">'+(G.mode==='little'?duaIcon(d):'')+'</div>'
      : '<div class="face front dua">'+duaIcon(d)+'<span class="t l">'+esc(T2(d.title))+'</span><span class="t s">'+esc(label(d))+'</span><span class="a" lang="ar">'+d.arabic+'</span></div>';
    return '<div class="card'+(c.id===G.today?' today':'')+'" role="button" tabindex="0" aria-label="'+L('Kartu ','Card ')+(n+1)+'" data-id="'+c.id+'" data-face="'+c.face+'" data-label="'+esc(label(d))+'">'
      +'<div class="inner"><div class="face back" style="--dl:'+(n*.37%5).toFixed(2)+'s"><div class="medal">'+medal+'</div>'+sp+sp.replace('sp a','sp b')+'</div>'+front+'</div></div>';
  }).join('');
  grid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>flip(c));
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(c); } });
  });
  show('gameScreen');
  fitGrid();
  clearInterval(ticker);
  ticker=setInterval(()=>{ if(!G||G.rvOpen||!$('gameScreen').classList.contains('active')) return; G.secs++; $('gTime').textContent=fmtT(G.secs); },1000);
}
// Size the cards so the whole board fits the screen without scrolling
function fitGrid(){
  const board=$('board'), grid=$('grid'), n=grid.children.length; if(!n) return;
  const W=board.clientWidth, H=board.clientHeight-8, gap=W<520?8:12;
  let best=null;
  for(let c=2;c<=8;c++){
    const r=Math.ceil(n/c); if(c*r-n>=c) continue;
    let cw=(W-gap*(c-1))/c, ch=(H-gap*(r-1))/r;
    ch=Math.min(ch,cw*1.45); cw=Math.min(cw,ch/.8,210); ch=Math.min(ch,cw*1.45);
    const sc=cw*ch*(r*c===n?1.04:1);
    if(cw>0&&ch>0&&(!best||sc>best.sc)) best={c,cw:Math.floor(cw),ch:Math.floor(ch),sc};
  }
  grid.style.setProperty('--cw',best.cw+'px'); grid.style.setProperty('--ch',best.ch+'px'); grid.style.setProperty('--gap',gap+'px');
  grid.style.width=(best.c*best.cw+gap*(best.c-1))+'px';
  // what fits on a du'a face: l = icon + title + 2 lines of Arabic, m = icon + label + 1 line, s = icon + label
  const cw=best.cw, ch=best.ch, fs=Math.max(11.5,Math.min(17,cw*.12)), pad=Math.max(6,Math.round(ch*.07)), g=fs*.3, tl=fs*1.15, al=fs*1.3*1.45;
  let is=Math.round(Math.min(cw*.42,ch*.36)), sz='s', ll=3;
  if(cw>=120&&pad*2+is+2*g+2*tl+2*al<=ch) sz='l';
  else if(cw>=96&&pad*2+is+2*g+2*tl+al<=ch) sz='m';
  else { if(pad*2+is+g+3*tl>ch) ll=2; if(pad*2+is+g+ll*tl>ch) is=Math.max(22,Math.floor(ch-pad*2-g-ll*tl)); }
  grid.classList.remove('sz-s','sz-m','sz-l'); grid.classList.add('sz-'+sz);
  grid.style.setProperty('--fs',fs.toFixed(1)+'px'); grid.style.setProperty('--is',is+'px'); grid.style.setProperty('--pad',pad+'px'); grid.style.setProperty('--ll',ll);
  const a=best.cw/best.ch;
  grid.querySelectorAll('.card').forEach(c=>{ const sc=c.querySelector('.pic svg.sc'); if(sc) sc.setAttribute('viewBox',cropFor(DUA[c.dataset.id],a)); });
}
function flip(card){
  if(!G||G.lock||G.rvOpen||card.classList.contains('up')||G.open.length>=2) return;
  card.classList.add('up','lift'); setTimeout(()=>card.classList.remove('lift'),600);
  card.querySelector('.front').classList.add('ds');
  card.setAttribute('aria-label',card.dataset.label);
  sfx('tap');
  G.open.push(card);
  if(G.open.length<2) return;
  G.moves++; $('gMoves').textContent=G.moves;
  const [a,b]=G.open;
  const match=a.dataset.id===b.dataset.id && (G.mode==='little' || a.dataset.face!==b.dataset.face);
  if(match){
    const d=DUA[a.dataset.id];
    say(d.arabic);                       // right inside the tap, so iOS lets it speak
    G.got++; G.lock=true;
    let bonus=false;
    if(d.id===G.today){ try{ bonus=!!(window.BabyMo&&BabyMo.daily&&BabyMo.daily.reward('dua-game','star-card',1)); }catch(e){} if(bonus) G.bonus=true; }
    setTimeout(()=>{
      a.classList.add('ok'); b.classList.add('ok'); sfx(bonus?'star':'correct');
      burst(a); burst(b);
      const t=$('tray').querySelector('[data-k="'+d.id+'"]'); if(t) t.classList.add('got');
      G.open=[];
      setTimeout(()=>reveal(d,bonus),520);
    },380);
  } else {
    G.misses++; G.lock=true;
    setTimeout(()=>{ a.classList.add('no'); b.classList.add('no'); sfx('wrong'); },520);
    setTimeout(()=>{
      [a,b].forEach(c=>{ c.classList.remove('up','no'); c.setAttribute('aria-label',L('Kartu','Card')); setTimeout(()=>c.querySelector('.front').classList.remove('ds'),500); });
      G.open=[]; G.lock=false;
    },1150);
  }
}
function burst(card){
  const r=card.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, g=['sparkle','star','sparkle'];
  for(let k=0;k<9;k++){
    const p=document.createElement('span'); p.className='burst'; p.innerHTML=ui(g[k%g.length]);
    const ang=k/9*Math.PI*2+Math.random()*.5, dist=r.width*.55+Math.random()*30;
    p.style.cssText='left:'+cx+'px;top:'+cy+'px;--dx:'+(Math.cos(ang)*dist).toFixed(0)+'px;--dy:'+(Math.sin(ang)*dist).toFixed(0)+'px;font-size:'+(12+Math.random()*12).toFixed(0)+'px';
    document.body.appendChild(p); setTimeout(()=>p.remove(),850);
  }
}
const CHEERS=[['Masya Allah!','Masha Allah!'],['Cocok!','A match!'],['Hebat!','Great job!'],['Alhamdulillah!','Alhamdulillah!'],['Pintar!','So clever!']];
let rvTimer=null;
function reveal(d,bonus){
  G.rvOpen=true;
  const ms=Math.min(14000,(soundOn()?4200+d.arabic.length*70:4200));
  const ch=CHEERS[(G.got-1)%CHEERS.length];
  $('rvCard').innerHTML='<div class="rv-sc ds">'+sceneSvg(d)+'<img src="'+poseOf(d)+'" alt=""><span class="rv-ok">'+(bonus?ui('star')+L('Bonus bintang hari ini!','Today\'s bonus star!'):ui('sparkle')+T2(ch))+'</span></div>'
    +'<div class="rv-b"><div class="rv-t">'+duaIcon(d)+'<span>'+esc(T2(d.title))+'</span></div>'
    +'<div class="rv-ar ar" lang="ar">'+d.arabic+'</div><div class="rv-la">'+esc(d.latin)+'</div><div class="rv-me">'+esc(meaning(d))+'</div>'
    +'<div class="rv-btns"><button type="button" class="rv-say">'+ui('sound')+L('Dengar','Listen')+'</button><button type="button" class="rv-go">'+(G.got===G.ids.length?L('Selesai!','Done!')+ui('sparkle'):L('Lanjut','Next')+ui('play'))+'</button></div></div>'
    +'<div class="rv-bar"><i style="transition:transform '+ms+'ms linear"></i></div>';
  $('rv').classList.add('on');
  const bar=$('rvCard').querySelector('.rv-bar i'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transform='scaleX(0)'; }));
  $('rvCard').querySelector('.rv-say').addEventListener('click',e=>{ e.stopPropagation(); say(d.arabic); });
  clearTimeout(rvTimer); rvTimer=setTimeout(closeReveal,ms);
}
function closeReveal(){
  if(!G||!G.rvOpen) return;
  clearTimeout(rvTimer); $('rv').classList.remove('on'); G.rvOpen=false; G.lock=false;
  if(G.got===G.ids.length){ G.lock=true; setTimeout(finish,250); }
}
$('rv').addEventListener('click',e=>{ if(!e.target.closest('.rv-say')) closeReveal(); });

// ════════════ FINISH ════════════
function starsFor(pairs,moves){ return moves<=pairs+Math.ceil(pairs*.8)?3:moves<=Math.ceil(pairs*2.5)+1?2:1; }
function finish(){
  clearInterval(ticker); hush();
  const s=G.s, pairs=G.ids.length, stars=starsFor(pairs,G.moves), perfect=G.misses===0;
  const before=furthest();
  R=load();
  const st=R.stops[s.id]=R.stops[s.id]||{}, prev=st[G.mode]||null;
  st[G.mode]={stars:Math.max(stars,prev?prev.stars:0),
    bestMoves:prev&&prev.bestMoves!=null?Math.min(prev.bestMoves,G.moves):G.moves,
    bestTime:prev&&prev.bestTime!=null?Math.min(prev.bestTime,G.secs):G.secs,
    perfect:!!(perfect||(prev&&prev.perfect)), plays:(prev&&prev.plays||0)+1};
  save(R);
  const cur=st[G.mode], opened=furthest()>before&&G.i+1<STOPS.length;
  try{ window.BabyMo&&BabyMo.daily&&BabyMo.daily.mark('dua-game','level'); }catch(e){}
  try{ window.BabyMo&&BabyMo.daily&&BabyMo.daily.reward('dua-game','stop-'+s.id,1); }catch(e){}
  sfx('win');
  const last=G.i===STOPS.length-1;
  $('dnMo').src='baby-mo-poses/'+(stars===3?'baby-mo-yeyy':stars===2?'baby-mo-thank-you':'baby-mo-ok')+'.webp';
  $('dnK').innerHTML=stopIcon(s)+'<span>'+esc(T2(s.name))+'</span>'+ui('check');
  $('dnT').innerHTML=(last?L('Juara Doa Sehari!','Du\'a Champion of the Day!')+ui('trophy'):stars===3?L('Masya Allah!','Masha Allah!')+ui('star'):stars===2?L('Alhamdulillah!','Alhamdulillah!')+ui('sparkle'):L('Terus berlatih!','Keep practising!')+ui('sprout'));
  $('dnStars').innerHTML=[0,1,2].map(k=>'<svg viewBox="0 0 24 24" class="'+(k<stars?'on':'')+'" style="animation-delay:'+(.3+k*.3)+'s"><path d="'+STAR_P+'"/>'+(k<stars?'<path class="hl" d="'+STAR_HL+'"/>':'')+'</svg>').join('');
  const b=[];
  if(opened) b.push('<span class="bdg g">'+ui('unlock')+L('Terbuka: ','Unlocked: ')+esc(T2(STOPS[G.i+1].name))+'</span>');
  if(perfect) b.push('<span class="bdg">'+ui('medal')+L('Tanpa Salah!','No Misses!')+'</span>');
  if(prev&&prev.bestMoves!=null&&(G.moves<prev.bestMoves||G.secs<prev.bestTime)) b.push('<span class="bdg">'+ui('trophy')+L('Rekor baru!','New record!')+'</span>');
  if(G.bonus) b.push('<span class="bdg">'+ui('star')+L('Bonus kartu hari ini','Star card bonus')+'</span>');
  $('dnBadges').innerHTML=b.join('');
  $('dnSt').innerHTML=ui('steps')+G.moves+L(' langkah',' moves')+' · '+ui('timer')+fmtT(G.secs);
  $('dnBest').innerHTML=prev&&prev.bestMoves!=null?L('Rekormu: ','Your best: ')+ui('steps')+cur.bestMoves+' · '+ui('timer')+fmtT(cur.bestTime):L('Rekor pertamamu tersimpan!','Your first record is saved!')+ui('sparkle');
  const nx=G.i+1<STOPS.length?STOPS[G.i+1]:null;
  $('dnBtns').innerHTML=(nx?'<button class="b1 bm-wa-pri" id="bNext">'+L('Lanjut: ','Next: ')+esc(T2(nx.name))+'</button>':'<button class="b1 bm-wa-pri" id="bAgain1">'+L('Main Lagi','Play Again')+'</button>')
    +'<div class="bm-wa-row"><button class="bm-wa-s" id="bMap"><svg class=\"wi\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14.5 5.5 8 12l6.5 6.5\"/></svg>'+L('Peta','Map')+'</button>'+(nx?'<button class="bm-wa-s" id="bAgain"><svg class="wi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5V9H9"/></svg>'+L('Ulangi','Replay')+'</button>':'')+'<button class="bm-wa-s" id="bShare"><svg class="wi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>'+L('Bagikan','Share')+'</button></div>';
  if(nx) $('bNext').onclick=()=>startStop(G.i+1);
  const again=$('bAgain')||$('bAgain1'); again.onclick=()=>startStop(G.i);
  $('bMap').onclick=goMap;
  $('bShare').onclick=()=>{ try{ BabyMo.shareScore('',stars,L('Aku menyelesaikan ','I finished ')+T2(s.name)+L(' di Dua Journey bareng Baby Mo! 🌟',' in Dua Journey with Baby Mo! 🌟'),{
    headline: last?L('Juara Doa Sehari!','Du\'a Champion!'):perfect?L('Tanpa salah!','No misses!'):T2(s.name),
    stats:[[L('Langkah','Moves'),G.moves],[L('Waktu','Time'),fmtT(G.secs)]] }); }catch(e){} };
  $('recap').innerHTML=G.ids.map(id=>{ const d=DUA[id]; return '<div class="rc">'+duaIcon(d)+'<div class="rc-t">'+esc(T2(d.title))+'</div><button class="rc-say" type="button" data-id="'+id+'" aria-label="'+L('Dengar','Listen')+'">'+ui('sound')+'</button>'
    +'<div class="rc-a ar" lang="ar">'+d.arabic+'</div><div class="rc-m">'+esc(meaning(d))+'</div></div>'; }).join('');
  $('recap').querySelectorAll('.rc-say').forEach(x=>x.addEventListener('click',()=>{ const was=R.sound; R.sound=true; say(DUA[x.dataset.id].arabic); R.sound=was; }));
  show('doneScreen');
}

// ════════════ NAV ════════════
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); $(id).scrollTop=0; if(id==='mapScreen') drawRoad(); /* the road is measured from the map's width — draw it once the map is visible */ }
function goMap(){ clearInterval(ticker); hush(); if(G) G.rvOpen=false; $('rv').classList.remove('on'); G=null; renderMap(); show('mapScreen'); scrollToCur(); }
function scrollToCur(){ const n=document.querySelector('.node.cur')||[...document.querySelectorAll('.node:not(.locked)')].pop(); if(n){ const sc=$('mapScreen'), y=n.offsetTop+$('journey').offsetTop; if(y+150>sc.clientHeight) sc.scrollTop=Math.max(0,y-sc.clientHeight*.45); } }
$('gBack').addEventListener('click',goMap);
/* redraw the road when the map changes size (rotation, iPad split view) */
try{ let rw=0; new ResizeObserver(()=>{ const w=$('journey').clientWidth; if(w&&w!==rw){ rw=w; drawRoad(); } }).observe($('journey')); }catch(e){}

renderMap();
requestAnimationFrame(()=>{ drawRoad(); scrollToCur(); });
</script>

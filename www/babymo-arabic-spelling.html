<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<script src="bm-theme.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<script src="bm-fit.js"></script>
<script src="i18n/kata.js"></script>
<script src="bm-i18n.js"></script>
<script src="voice/manifest.js"></script>
<script src="bm-voice.js"></script>
<meta name="theme-color" content="#03100c" />
<meta name="description" content="Susun huruf untuk mengeja kosakata islami dalam bahasa Arab.">
<title>Kata Islam — Belajar Menyusun Kata Arab untuk Anak | Baby Mo</title>

<link rel="stylesheet" href="fonts/fonts.css">

<style>
  :root {
    --bg-deepest: #03100c;
    --bg-deep:    #061a14;
    --bg-mid:     #0a2820;
    --emerald:      #10b981;
    --emerald-soft: #34d399;
    --emerald-deep: #065f46;
    --gold:      #fbbf24;
    --gold-soft: #fcd34d;
    --gold-deep: #d97706;
    --ivory:      #fffbeb;
    --text:       #f0fdf4;
    --text-soft:  rgba(240,253,244,0.62);
    --text-faint: rgba(240,253,244,0.36);

    --rose:       rgba(244,114,182,1);
    --moonlight:  rgba(251,191,36,1);
    --leaf:       rgba(132,204,22,1);

    --r-card: 28px;
    --r-pill: 999px;
    --f-arabic:  'Amiri', 'Scheherazade New', serif;
    --f-display: 'Fredoka', 'Nunito', sans-serif;
    --f-body:    'Nunito', system-ui, sans-serif;
  }

  * {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    background: var(--bg-deepest);
    color: var(--text);
    font-family: var(--f-body);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% -5%,  rgba(16,185,129,0.10), transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(6,95,70,0.12),    transparent 70%),
      radial-gradient(circle at 85% 18%, rgba(251,191,36,0.05), transparent 40%),
      linear-gradient(180deg, #061a14 0%, #03100c 70%, #020a07 100%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 17% 24%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(1px 1px at 62% 71%, rgba(251,191,36,0.22),  transparent 60%),
      radial-gradient(1px 1px at 81% 18%, rgba(255,255,255,0.30), transparent 60%),
      radial-gradient(1px 1px at 33% 82%, rgba(16,185,129,0.28),  transparent 60%),
      radial-gradient(1px 1px at 91% 58%, rgba(255,255,255,0.20), transparent 60%),
      radial-gradient(1px 1px at 48% 41%, rgba(251,191,36,0.18),  transparent 60%);
    background-size: 240px 240px;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 9s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    top: -40px; right: -60px;
    width: 240px; height: 240px;
    background: radial-gradient(circle at 30% 50%, rgba(251,191,36,0.10), transparent 55%);
    pointer-events: none;
    z-index: 0;
    filter: blur(8px);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 14px 18px calc(160px + env(safe-area-inset-bottom));
    padding-top: calc(14px + env(safe-area-inset-top));
    min-height: 100vh;
  }

  .view { display: none; }
  .view.active { display: block; animation: viewIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 2px 4px;
    margin-bottom: 8px;
  }
  .btn-soft {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(16,185,129,0.07);
    border: 1px solid rgba(16,185,129,0.20);
    color: var(--text-soft);
    font-family: var(--f-body);
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.02em;
    padding: 9px 16px;
    border-radius: var(--r-pill);
    text-decoration: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: transform .2s ease, background .25s ease, color .25s ease;
  }
  .btn-soft:active {
    transform: scale(0.95);
    background: rgba(16,185,129,0.14);
    color: var(--text);
  }
  .topbar-info {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.20);
    border-radius: var(--r-pill);
    padding: 7px 14px;
    font-size: 11px;
    color: var(--gold-soft);
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .topbar-info .info-icon {
    font-size: 13px;
    filter: drop-shadow(0 0 6px rgba(251,191,36,0.5));
  }

  /* ===== MENU ===== */
  .hero { text-align: center; padding: 14px 0 8px; position: relative; }
  .mascot {
    width: 140px; height: 160px;
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .mascot-glow {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 140px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%, rgba(16,185,129,0.35), transparent 65%),
      radial-gradient(circle at 50% 50%, rgba(251,191,36,0.08), transparent 70%);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .mascot-glow::after {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(251,191,36,0.18);
    animation: haloPulse 4.5s ease-in-out infinite;
  }
  .mascot img {
    width: 150px; height: 150px;
    object-fit: contain;
    filter: drop-shadow(0 6px 22px rgba(16,185,129,0.45));
    position: relative;
    z-index: 1;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes haloPulse { 0%,100%{transform:scale(1);opacity:0.45} 50%{transform:scale(1.08);opacity:0.75} }

  .hero h1 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    color: var(--ivory);
    text-shadow: 0 0 30px rgba(251,191,36,0.22), 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero h1 .sparkle {
    display: inline-block; margin-left: 4px;
    animation: sparkleSpin 3s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(251,191,36,0.7));
  }
  @keyframes sparkleSpin {
    0%,100%{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(18deg) scale(1.18)}
  }

  .section-preview {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .preview-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16,185,129,0.07);
    border: 1px solid rgba(16,185,129,0.18);
    border-radius: var(--r-pill);
    padding: 8px 14px;
    font-family: var(--f-body);
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform .2s ease, background .25s ease, border-color .25s ease;
  }
  .preview-chip:active {
    transform: scale(0.94);
    background: rgba(16,185,129,0.16);
    border-color: rgba(16,185,129,0.40);
  }
  .preview-chip.active-chip {
    background: rgba(16,185,129,0.18);
    border-color: rgba(16,185,129,0.45);
    color: var(--text);
  }
  .preview-chip span:first-child { font-size: 14px; }

  .section {
    margin-top: 32px;
    position: relative;
    scroll-margin-top: calc(60px + env(safe-area-inset-top));
  }
  .section + .section { margin-top: 28px; }

  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 4px 16px;
  }
  .section-emoji {
    font-size: 26px; line-height: 1;
  }
  .section-title {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 18px;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .section-count {
    font-size: 10px;
    color: var(--text-faint);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .section-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(16,185,129,0.30) 0%, transparent 100%);
  }

  .section[data-section="family"] .section-emoji {
    filter: drop-shadow(0 0 14px rgba(244,114,182,0.55));
  }
  .section[data-section="islam"] .section-emoji {
    filter: drop-shadow(0 0 14px rgba(251,191,36,0.55));
  }
  .section[data-section="nature"] .section-emoji {
    filter: drop-shadow(0 0 14px rgba(132,204,22,0.55));
  }
  .section[data-section="family"] .section-line {
    background: linear-gradient(90deg, rgba(244,114,182,0.30) 0%, transparent 100%);
  }
  .section[data-section="nature"] .section-line {
    background: linear-gradient(90deg, rgba(132,204,22,0.30) 0%, transparent 100%);
  }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .card {
    position: relative;
    background:
      linear-gradient(160deg, rgba(16,185,129,0.10) 0%, rgba(6,95,70,0.04) 60%, rgba(3,16,12,0.10) 100%);
    border: 1px solid rgba(16,185,129,0.20);
    border-radius: var(--r-card);
    padding: 16px 10px 16px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 12px 28px rgba(0,0,0,0.30);
    transition: transform .28s cubic-bezier(0.34,1.56,0.64,1), box-shadow .35s ease, border-color .3s ease;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
    min-height: 180px;
    font: inherit;
    color: inherit;
  }

  .section[data-section="family"] .card {
    background:
      linear-gradient(160deg, rgba(244,114,182,0.08) 0%, rgba(6,95,70,0.04) 60%, rgba(3,16,12,0.10) 100%);
    border: 1px solid rgba(244,114,182,0.18);
  }
  .section[data-section="family"] .card:active {
    border-color: rgba(244,114,182,0.50);
    box-shadow:
      0 0 0 1px rgba(244,114,182,0.30) inset,
      0 0 40px rgba(244,114,182,0.25),
      0 12px 32px rgba(0,0,0,0.35);
  }

  .section[data-section="nature"] .card {
    background:
      linear-gradient(160deg, rgba(132,204,22,0.10) 0%, rgba(6,95,70,0.04) 60%, rgba(3,16,12,0.10) 100%);
    border: 1px solid rgba(132,204,22,0.18);
  }
  .section[data-section="nature"] .card:active {
    border-color: rgba(132,204,22,0.50);
    box-shadow:
      0 0 0 1px rgba(132,204,22,0.30) inset,
      0 0 40px rgba(132,204,22,0.25),
      0 12px 32px rgba(0,0,0,0.35);
  }

  .card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(16,185,129,0.18), transparent 60%);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute; top:0; left:0; right:0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
    pointer-events: none;
    border-radius: var(--r-card) var(--r-card) 0 0;
  }
  .card:active {
    transform: scale(0.96);
    border-color: rgba(251,191,36,0.45);
    box-shadow:
      0 0 0 1px rgba(251,191,36,0.30) inset,
      0 0 40px rgba(16,185,129,0.30),
      0 12px 32px rgba(0,0,0,0.35);
  }
  .card:active::before { opacity: 1; }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }

  .card-spark {
    position: absolute; top: 12px; right: 14px;
    font-size: 11px; opacity: 0.55;
    animation: sparkRotate 9s linear infinite;
    filter: drop-shadow(0 0 6px rgba(251,191,36,0.45));
  }
  @keyframes sparkRotate { to { transform: rotate(360deg); } }

  /* The picture sits in its own reserved row; it only floats upward, so it
     can never drift into the Arabic word (or its harakat) below. */
  .card-emoji {
    font-size: 34px; line-height: 1;
    display: grid; place-items: center;
    height: 42px; flex: 0 0 42px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
    animation: floatGentle 5s ease-in-out infinite;
  }
  .card:nth-child(2n) .card-emoji { animation-delay: -2.5s; }
  @keyframes floatGentle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

  /* Amiri's harakat (أُ أَ, kasra under ي) reach far outside a tight line box:
     give the word a tall line so marks stay clear of the picture above and
     the Latin line below. */
  .card-arabic {
    font-family: var(--f-arabic);
    font-weight: 700;
    font-size: 48px;
    line-height: 1.95;
    color: var(--ivory);
    margin: 0 0 2px;
    padding-top: 10px;
    max-width: 100%;
    white-space: nowrap;
    direction: rtl;
    text-shadow:
      0 0 22px rgba(251,191,36,0.26),
      0 0 12px rgba(16,185,129,0.28);
    letter-spacing: 0.01em;
  }
  .card-latin {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--gold-soft);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .card-meaning {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: lowercase;
  }

  /* ----- PINNED CTA (menu only — toggled via JS) ----- */
  .cta-wrap {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 18px;
    right: 18px;
    max-width: 404px;
    margin: 0 auto;
    z-index: 50;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: ctaWrapIn 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
    animation-delay: 1.0s;
  }
  @keyframes ctaWrapIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .cta-backdrop {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(130px + env(safe-area-inset-bottom));
    background: linear-gradient(to top,
      var(--bg-deepest) 0%,
      rgba(3,16,12,0.85) 40%,
      transparent 100%);
    z-index: 49;
    pointer-events: none;
  }

  .cta {
    display: block; width: 100%;
    padding: 18px 22px;
    background:
      radial-gradient(circle at 30% 0%, rgba(251,191,36,0.30), transparent 50%),
      linear-gradient(135deg, #10b981 0%, #059669 55%, #047857 100%);
    border: none;
    border-radius: 22px;
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 17px;
    color: #fffbeb;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-shadow: 0 1px 8px rgba(0,0,0,0.30);
    box-shadow:
      0 0 0 1px rgba(251,191,36,0.35) inset,
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 10px 26px rgba(16,185,129,0.38),
      0 0 44px rgba(16,185,129,0.26);
    transition: transform .2s ease;
    animation: ctaGlow 3.8s ease-in-out infinite;
  }
  @keyframes ctaGlow {
    0%,100% {
      box-shadow:
        0 0 0 1px rgba(251,191,36,0.35) inset,
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 10px 26px rgba(16,185,129,0.38),
        0 0 44px rgba(16,185,129,0.26);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(251,191,36,0.55) inset,
        0 1px 0 rgba(255,255,255,0.18) inset,
        0 12px 32px rgba(16,185,129,0.55),
        0 0 64px rgba(16,185,129,0.42);
    }
  }
  .cta::before {
    content: '';
    position: absolute;
    top: 0; left: -120%;
    width: 70%; height: 100%;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
    animation: ctaShine 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ctaShine { 0%,100%{left:-120%} 50%{left:120%} }
  .cta:active { transform: scale(0.97); }
  .cta .emoji-left  { margin-right: 8px; filter: drop-shadow(0 0 6px rgba(251,191,36,0.7)); }
  .cta .emoji-right { margin-left: 8px;  filter: drop-shadow(0 0 6px rgba(251,191,36,0.7)); }

  .cta-hint {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.10em;
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ===== GAME ===== */
  .game-progress {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
    letter-spacing: 0.08em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .game-progress .sec-icon {
    font-size: 14px;
    filter: drop-shadow(0 0 8px rgba(251,191,36,0.4));
  }

  .word-card {
    text-align: center;
    padding: 22px 18px 24px;
    background:
      linear-gradient(160deg, rgba(16,185,129,0.10) 0%, rgba(6,95,70,0.04) 60%, rgba(3,16,12,0.10) 100%);
    border: 1px solid rgba(16,185,129,0.20);
    border-radius: 28px;
    margin: 18px 0 30px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 12px 28px rgba(0,0,0,0.30);
  }
  .word-card::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
    pointer-events: none;
    border-radius: 28px 28px 0 0;
  }
  .word-emoji {
    font-size: 56px; line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
    animation: floatGentle 5s ease-in-out infinite;
  }
  .word-latin {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 20px;
    color: var(--gold-soft);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .word-meaning {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.10em;
    text-transform: lowercase;
  }
  .word-ghost {
    font-family: var(--f-arabic);
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    color: rgba(255,255,255,0.12);
    direction: rtl;
    margin-top: 16px;
    letter-spacing: 0.02em;
    transition: color .4s ease, text-shadow .4s ease;
  }
  .word-card.speaking-word .word-ghost {
    color: rgba(252,211,77,0.85);
    text-shadow: 0 0 24px rgba(251,191,36,0.55);
  }

  .slots {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    gap: 10px;
    margin-bottom: 34px;
    padding: 0 4px;
    flex-wrap: wrap;
  }
  .slot {
    width: 62px; height: 78px;
    border-radius: 20px;
    background: rgba(16,185,129,0.05);
    border: 2px dashed rgba(16,185,129,0.30);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: all .3s cubic-bezier(0.34,1.56,0.64,1);
    flex-shrink: 0;
  }
  .slot-ghost {
    font-family: var(--f-arabic);
    font-weight: 700;
    font-size: 36px;
    color: rgba(255,255,255,0.10);
    line-height: 1;
    direction: rtl;
  }
  .slot.filled {
    background: linear-gradient(160deg, rgba(16,185,129,0.30), rgba(6,95,70,0.15));
    border: 2px solid rgba(251,191,36,0.55);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.10) inset,
      0 0 30px rgba(16,185,129,0.40),
      0 0 18px rgba(251,191,36,0.30);
    animation: slotPop 0.55s cubic-bezier(0.34,1.56,0.64,1);
  }
  .slot.speaking {
    animation: slotSpeak 0.6s ease;
  }
  @keyframes slotPop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes slotSpeak {
    0%, 100% { box-shadow:
      0 0 0 1px rgba(255,255,255,0.10) inset,

  .learned-list {

  .btn-secondary {

  .btn-primary {

  .btn-primary:active { transform: scale(0.96); }

  /* ===== shared ===== */
  .spark-particle {

    will-change: transform, opacity;
  }
  @keyframes sparkBurst {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.4); }
    20%  { opacity: 1; transform: translate(var(--dx,0), -8px) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx,0), -70px) scale(0.7); }
  }

  /* ----- Themed celebration particles ----- */
  .celebrate {
    position: fixed;
    pointer-events: none;
    z-index: 210;
    will-change: transform, opacity;
  }
  .celebrate-rise {
    animation: celebRise var(--dur, 1.8s) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;

  .celebrate-fall {
    animation: celebFall var(--dur, 2.2s) ease-in forwards;
  }
  .celebrate-burst {
    animation: celebBurst var(--dur, 1.4s) cubic-bezier(0.2, 0.9, 0.3, 1) forwards;

  .celebrate-fly {
    animation: celebFly var(--dur, 2s) ease-in-out forwards;
  }
  .celebrate-swim {
    animation: celebSwim var(--dur, 2.4s) ease-in-out forwards;
  }
  @keyframes celebRise {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.3) rotate(0deg); }
    15%  { opacity: 1; transform: translate(var(--dx,0), -20px) scale(1.1) rotate(var(--rot, 10deg)); }

  @keyframes celebFall {

    100% { opacity: 0; transform: translate(var(--dx2,0), var(--dy, 200px)) scale(0.6) rotate(var(--rot2, 45deg)); }
  }
  @keyframes celebBurst {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.2); }
    20%  { opacity: 1; transform: translate(var(--dx,0), var(--dy,0)) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--dx2,0), var(--dy2,0)) scale(0.4); }
  }
  @keyframes celebFly {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(0deg); }

    100% { opacity: 0; transform: translate(var(--dx2, 120px), var(--dy, -160px)) scale(0.7) rotate(var(--rot, -15deg)); }
  }
  @keyframes celebSwim {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.3); }
    15%  { opacity: 1; transform: translate(var(--dx,0), 10px) scale(1); }
    50%  { transform: translate(var(--dx2,0), var(--dy, 30px)) scale(0.9); }
    100% { opacity: 0; transform: translate(var(--dx3,0), var(--dy2, 80px)) scale(0.5); }
  }

  /* ----- Masya Allah toast: translucent so content shows through ----- */
  .toast {
    position: fixed;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%) scale(0.7);
    background: linear-gradient(135deg, rgba(16,185,129,0.40), rgba(6,95,70,0.40));

    opacity: 0;
    pointer-events: none;
    text-align: center;

  .toast.show { animation: toastIn 1.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    display: block;
    font-size: 28px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 10px rgba(251,191,36,0.6));

  @keyframes toastIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    18%  { opacity: 0.63; transform: translate(-50%, -50%) scale(1.05); }
    32%  { opacity: 0.63; transform: translate(-50%, -50%) scale(0.98); }

    100% { opacity: 0; transform: translate(-50%, -55%) scale(0.95); }

  @media (max-width: 360px) {

/* ----- Speech ----- */
if ('speechSynthesis' in window) {
  try { window.speechSynthesis.getVoices(); } catch (e) {}
  if ('onvoiceschanged' in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function () {
      try { window.speechSynthesis.getVoices(); } catch (e) {}
    };
  }
}

function getArabicVoice() {
  if (!('speechSynthesis' in window)) return null;
  try {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(function (v) {
      return v.lang && v.lang.toLowerCase().indexOf('ar') === 0;
    }) || null;
  } catch (e) { return null; }
}

function cancelSpeech() {
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function speakArabic(text, opts, onEnd) {
  opts = opts || {};
  if (!('speechSynthesis' in window)) {
    if (onEnd) setTimeout(onEnd, 80); return;
  }
  const voice = getArabicVoice();
  // a recorded clip (bm-voice.js) speaks even when the phone has no Arabic voice
  const clip = !!(window.BMVoice && BMVoice.has(text));
  if (!voice && !clip) { if (onEnd) setTimeout(onEnd, 80); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang  = voice ? voice.lang : 'ar-SA';
    u.rate  = opts.rate  || 0.85;
    u.pitch = opts.pitch || 1.0;
    u.volume = 1.0;
    let ended = false;
    const done = function () { if (ended) return; ended = true; if (onEnd) onEnd(); };
    u.onend = done; u.onerror = done;
    window.speechSynthesis.speak(u);
    setTimeout(done, Math.max(text.length * 220, 2500));
  } catch (e) { if (onEnd) setTimeout(onEnd, 80); }
}

function speakLetterQuick(letter) {
  const name = LETTER_NAMES[letter];
  if (!name) return;
  cancelSpeech();
  speakArabic(name, { rate: 0.95, pitch: 1.1 });
}

function speakWordSequence(word, onComplete, onLetter, onWord) {
  cancelSpeech();
  const names = word.letters.map(function (l) { return LETTER_NAMES[l] || l; });
  let i = 0;
  function next() {
    if (i >= names.length) {
      if (onWord) onWord();
      speakArabic(word.arabic, { rate: 0.78, pitch: 1.0 }, function () {
        if (onComplete) setTimeout(onComplete, 250);
      });
      return;
    }
    if (onLetter) onLetter(i);
    speakArabic(names[i], { rate: 0.85, pitch: 1.05 }, function () {
      i++; setTimeout(next, 120);
    });
  }
  next();
}

function kSave(r) { try { localStorage.setItem(KKEY, JSON.stringify(r)); } catch (e) {} }
function wordKey(w) { return w.section + ':' + w.latin; }
function starsFor(wrong) { return wrong === 0 ? 3 : wrong <= 2 ? 2 : 1; }
function saveWord(w, wrong) {
  const r = kLoad(), k = wordKey(w), prev = r.words[k] || 0, st = starsFor(wrong);
  r.words[k] = Math.max(prev, st); kSave(r);
  return { stars: st, isNew: !prev };
}
function doneCount(r) { return WORDS.filter(function (w) { return r.words[wordKey(w)]; }).length; }
function starRow(n) { return [1, 2, 3].map(function (k) { return '<i class="' + (k <= n ? 'on' : '') + '">★</i>'; }).join(''); }
function dailyWordIdx() {
  try { if (window.BabyMo && BabyMo.daily) return WORDS.indexOf(BabyMo.daily.pick(WORDS, 'kata-islam-word')); } catch (e) {}
  const t = new Date(); return (t.getFullYear() * 372 + t.getMonth() * 31 + t.getDate()) % WORDS.length;
}
function dailyDone() { try { return !!(window.BabyMo && BabyMo.daily && BabyMo.daily.did('arabic-spelling', 'word-of-day')); } catch (e) { return false; } }

function decorateMenu() {
  const r = kLoad();
  document.querySelectorAll('#menuSections .card').forEach(function (btn) {
    const w = WORDS[+btn.dataset.wordIndex], st = r.words[wordKey(w)] || 0;

    if (!row) { row = document.createElement('div'); row.className = 'card-stars'; btn.appendChild(row); }
    row.innerHTML = starRow(st);

    if (st && !ok) { ok = document.createElement('span'); ok.className = 'card-done'; ok.textContent = '✓'; btn.appendChild(ok); }

  SECTIONS.forEach(function (sec) {
    const el = document.querySelector('.section[data-section="' + sec.id + '"] .section-header'); if (!el) return;
    const ws = getSectionWords(sec.id), n = ws.filter(function (w) { return r.words[wordKey(w)]; }).length;
    let pr = el.querySelector('.sec-prog');
    if (!pr) { pr = document.createElement('span'); pr.className = 'sec-prog'; el.appendChild(pr); }
    pr.className = 'sec-prog' + (n === ws.length ? ' done' : '');
    pr.textContent = n === ws.length ? '✓ ' + L('Selesai', 'Done') : n + '/' + ws.length;

    + '<div class="lc-t">' + w.latin + '</div><div class="lc-m">' + w.meaning + '</div></div>'

    + '<div class="lc-foot"><div class="lc-s">' + (done ? L('Sudah! Bintang bonus didapat ⭐', 'Done! Bonus star earned ⭐') : L('Susun kata ini untuk ⭐ bonus!', 'Build this word for a bonus ⭐!')) + '</div></div>';
  kc.hidden = false;
  document.getElementById('kotdGo').onclick = function (e) { spawnSparkles(e.currentTarget, 3); setTimeout(function () { startDaily(); }, 160); };

  const n = doneCount(r), sc = document.getElementById('speedCard'), open = n >= WORDS.length;

    + '<div class="lc-t">' + (open ? L('Susun 5 kata sebelum waktunya habis!', 'Build 5 words before time runs out!') : L('Selesaikan semua 21 kata dulu', 'Finish all 21 words first')) + '</div>'
    + (open ? '<div class="lc-s">' + (r.speed.best ? '🏆 ' + L('Skor terbaik: ', 'Best score: ') + r.speed.best : L('Belum ada skor — ayo coba!', 'No score yet — give it a go!')) + '</div>'
            : '<div class="lc-bar"><i style="width:' + Math.round(100 * n / WORDS.length) + '%"></i></div><div class="lc-s">' + n + ' / ' + WORDS.length + ' ' + L('kata', 'words') + '</div>')
    + '</div><button class="lc-go" type="button" id="speedGo"' + (open ? '' : ' aria-disabled="true"') + '>' + (open ? L('Main ▶', 'Play ▶') : bwIcon('lock')) + '</button></div>';

function startDaily() {
  cancelSpeech(); stopSpeed();
  state.mode = 'daily';
  state.currentIdx = dailyWordIdx(); state.sessionStartIdx = state.currentIdx;
  state.wrongCount = 0; state.completedWords = [];
  renderWord(); showView('Game');
}
function finishDaily(word) {
  let got = false;
  try { got = !!(window.BabyMo && BabyMo.daily && BabyMo.daily.reward('arabic-spelling', 'word-of-day', 1)); } catch (e) {}
  try { window.BabyMo && BabyMo.daily && BabyMo.daily.mark('arabic-spelling', 'word-of-day'); } catch (e) {}
  showToast(got ? L('Bonus ⭐ Kata Hari Ini!', 'Word of the Day bonus ⭐!') : L('Masya Allah!', 'Masha Allah!'), got ? '⭐' : '✨');

/* Speed round: 5 random words, a gentle 75-second timer. Score = 20 per
   word, plus the seconds left when all 5 are done. */
const SPEED_N = 5, SPEED_MS = 75000;
const speed = { queue: [], pos: 0, t0: 0, timer: null, score: 0, done: 0 };
function stopSpeed() { clearInterval(speed.timer); speed.timer = null; }
function startSpeed() {
  cancelSpeech(); stopSpeed();
  const idx = WORDS.map(function (_, i) { return i; });
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  speed.queue = idx.slice(0, SPEED_N); speed.pos = 0; speed.done = 0; speed.t0 = Date.now();
  state.mode = 'speed'; state.wrongCount = 0; state.completedWords = [];
  state.currentIdx = speed.queue[0];
  renderWord(); showView('Game');
  const bar = document.getElementById('speedBar');
  speed.timer = setInterval(function () {
    const left = Math.max(0, SPEED_MS - (Date.now() - speed.t0));
    bar.firstElementChild.style.width = (100 * left / SPEED_MS) + '%';
    bar.classList.toggle('low', left < 15000);
    if (!left) endSpeed(false);
  }, 200);
}
function speedHead() {
  const h = document.getElementById('speedHead');
  h.innerHTML = '<span>⚡ ' + (speed.pos + 1) + ' / ' + SPEED_N + '</span><span>✓ ' + speed.done + '</span>';
}
function speedNext() {
  speed.done++; speed.pos++;
  if (speed.pos >= SPEED_N) { endSpeed(true); return; }
  state.currentIdx = speed.queue[speed.pos];
  setTimeout(function () { if (state.mode === 'speed') renderWord(); }, 650);
}
function endSpeed(all) {
  if (state.mode !== 'speed') return;
  stopSpeed();
  document.getElementById('gamePool').innerHTML = '';
  const left = Math.max(0, Math.round((SPEED_MS - (Date.now() - speed.t0)) / 1000));
  const score = speed.done * 20 + (all ? left : 0);
  const r = kLoad(), prev = r.speed.best || 0, isNew = score > prev;
  r.speed = { best: Math.max(prev, score), plays: (r.speed.plays || 0) + 1, last: score }; kSave(r);
  if (all) { try { window.BabyMo && BabyMo.daily && BabyMo.daily.reward('arabic-spelling', 'speed', 1); } catch (e) {} }
  state.mode = 'over';
  const c = document.getElementById('srCard');
  c.innerHTML = '<div class="big">' + (all ? '⚡' : '⏰') + '</div>'
    + '<h2>' + (all ? L('Masya Allah, cepat!', 'Masha Allah, so fast!') : L('Waktu habis!', 'Time\'s up!')) + '</h2>'
    + '<div class="sc">⭐ ' + score + '</div>'
    + '<div class="sub">' + L(speed.done + ' dari ' + SPEED_N + ' kata', speed.done + ' of ' + SPEED_N + ' words') + (all ? L(' · sisa ' + left + ' detik', ' · ' + left + ' s left') : '') + '</div>'
    + (isNew && prev ? '<div class="new">🎉 ' + L('Rekor baru!', 'New record!') + '</div>' : '<div class="sub">🏆 ' + L('Skor terbaik: ', 'Best score: ') + r.speed.best + '</div>')
    + '<div class="row"><button class="btn-secondary" type="button" id="srMenu">← ' + L('Menu', 'Menu') + '</button><button class="btn-primary" type="button" id="srAgain">⚡ ' + L('Lagi!', 'Again!') + '</button></div>';
  document.getElementById('srModal').hidden = false;
  document.getElementById('srMenu').onclick = function () { document.getElementById('srModal').hidden = true; showView('Menu'); };
  document.getElementById('srAgain').onclick = function () { document.getElementById('srModal').hidden = true; startSpeed(); };
}

function showView(name) {
  if (name !== 'Game') stopSpeed();
  const sp = name === 'Game' && state.mode === 'speed';
  document.getElementById('speedBar').hidden = !sp;
  document.getElementById('speedHead').hidden = !sp;
  document.getElementById('gameDots').style.display = (name === 'Game' && state.mode !== 'learn') ? 'none' : '';
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  document.getElementById('view' + name).classList.add('active');

  // Pinned CTA only visible on Menu view
  const isMenu = (name === 'Menu');
  const ctaWrap = document.getElementById('ctaWrap');
  const ctaBackdrop = document.getElementById('ctaBackdrop');
  if (ctaWrap)     ctaWrap.style.display     = isMenu ? '' : 'none';
  if (ctaBackdrop) ctaBackdrop.style.display = isMenu ? '' : 'none';

  window.scrollTo({ top: 0 });
  if (isMenu) decorateMenu();
}

function getSection(id) { return SECTIONS.find(function (s) { return s.id === id; }); }
function getSectionWords(id) { return WORDS.filter(function (w) { return w.section === id; }); }
function getFirstIdxOfSection(id) { return WORDS.findIndex(function (w) { return w.section === id; }); }
function getNextSection(currentId) {
  const idx = SECTIONS.findIndex(function (s) { return s.id === currentId; });
  return (idx >= 0 && idx < SECTIONS.length - 1) ? SECTIONS[idx + 1] : null;
}
function getSectionPosition(wordIdx) {
  const w = WORDS[wordIdx];
  const sectionWords = getSectionWords(w.section);
  const pos = sectionWords.findIndex(function (x) { return x === w; });
  return { position: pos, total: sectionWords.length };
}

/* ----- Toast / sparkles ----- */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(text, emoji) {
  if (typeof emoji === 'undefined') emoji = bwIcon('sparkle');
  toastEl.innerHTML = '<span class="toast-emoji">' + emoji + '</span>' + text;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
}

function spawnSparkles(originEl, count) {
  if (typeof count === 'undefined') count = 5;
  const rect = originEl.getBoundingClientRect();
  const glyphs = ['✨','⭐','✦','🌟'];
  for (let i = 0; i < count; i++) {
    setTimeout(function () {
      const s = document.createElement('span');
      s.className = 'spark-particle';
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (Math.random() - 0.5) * 90;
      s.style.left = (cx - 7) + 'px';
      s.style.top  = (cy - 10) + 'px';
      s.style.setProperty('--dx', dx + 'px');
      document.body.appendChild(s);
      setTimeout(function () { s.remove(); }, 1200);
    }, i * 55);
  }
}

/* ----- Menu render ----- */

  const container = document.getElementById('menuSections');
  container.innerHTML = '';
  let globalCardIdx = 0;
  SECTIONS.forEach(function (sec) {
    const words = getSectionWords(sec.id);
    const sectionEl = document.createElement('section');

      '<div class="section-header">' +
        '<span class="section-emoji" aria-hidden="true">' + secIcon(sec) + '</span>' +
        '<h2 class="section-title" id="sec-' + sec.id + '">' + sec.name + '</h2>' +
        '<span class="section-count">' + words.length + ' Kata</span>' +
        '<div class="section-line" aria-hidden="true"></div>' +
      '</div>' +
      '<div class="cards" id="cards-' + sec.id + '"></div>';
    container.appendChild(sectionEl);

    const cardsEl = sectionEl.querySelector('.cards');
    words.forEach(function (w) {
      const globalIdx = WORDS.indexOf(w);
      const btn = document.createElement('button');
      btn.className = 'card';
      btn.type = 'button';
      btn.dataset.wordIndex = String(globalIdx);
      btn.setAttribute('aria-label', w.latin + ' — ' + w.meaning);
      const delay = Math.min(0.12 + globalCardIdx * 0.04, 0.85);
      btn.style.animationDelay = delay + 's';
      btn.innerHTML =
        '<span class="card-spark" aria-hidden="true">✦</span>' +
        '<span class="card-emoji" aria-hidden="true">' + wordArt(w) + '</span>' +
        '<div class="card-arabic" lang="ar">' + w.arabic + '</div>' +
        '<div class="card-latin">' + w.latin + '</div>' +
        '<div class="card-meaning">' + w.meaning + '</div>';
      btn.addEventListener('click', function () {
        spawnSparkles(btn, 3);
        setTimeout(function () { startGame(globalIdx); }, 180);
      });
      cardsEl.appendChild(btn);
      globalCardIdx++;
    });
  });
}

/* ----- Game ----- */
function startGame(startIdx) {
  if (typeof startIdx !== 'number') startIdx = 0;
  cancelSpeech(); stopSpeed();
  state.mode = 'learn';
  state.currentIdx = startIdx;
  state.sessionStartIdx = startIdx;
  state.wrongCount = 0;
  state.completedWords = [];
  renderWord();
  showView('Game');
}

function renderWord() {
  const word = WORDS[state.currentIdx];
  const sec = getSection(word.section);
  const pos = getSectionPosition(state.currentIdx);
  state.filled = word.letters.map(function () { return false; });
  state.wordWrong = 0;
  if (state.mode === 'speed') speedHead();

  document.getElementById('gameSecIcon').innerHTML = secIcon(sec);
  document.getElementById('gameStep').textContent = state.mode === 'daily' ? '✨ ' + L('Kata Hari Ini', 'Word of the Day')
    : state.mode === 'speed' ? '⚡ ' + L('Ronde Kilat', 'Speed Round') : (pos.position + 1) + ' / ' + pos.total;

  const dotsEl = document.getElementById('gameDots');
  let dotsHtml = '';
  for (let i = 0; i < pos.total; i++) {
    let cls = 'dot';
    if (i < pos.position) cls += ' done';
    else if (i === pos.position) cls += ' active';
    dotsHtml += '<span class="' + cls + '"></span>';
  }
  dotsEl.innerHTML = dotsHtml;

  document.getElementById('gameWordCard').classList.remove('speaking-word');
  document.getElementById('gameEmoji').innerHTML = wordArt(word);
  document.getElementById('gameLatin').textContent = word.latin;
  document.getElementById('gameMeaning').textContent = word.meaning;
  document.getElementById('gameGhost').textContent = word.arabic;

  const slotsEl = document.getElementById('gameSlots');
  slotsEl.innerHTML = '';
  word.letters.forEach(function (letter, i) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.letter = letter;
    slot.dataset.index = String(i);
    slot.innerHTML = '<span class="slot-ghost" lang="ar">' + letter + '</span>';
    slotsEl.appendChild(slot);
  });

  markNextSlot();
  const poolEl = document.getElementById('gamePool');
  poolEl.innerHTML = '';
  const shuffled = word.letters
    .map(function (l, idx) { return { l: l, idx: idx }; })
    .sort(function () { return Math.random() - 0.5; });
  shuffled.forEach(function (entry) {
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.type = 'button';
    tile.dataset.letter = entry.l;
    tile.lang = 'ar';
    tile.textContent = entry.l;
    tile.addEventListener('click', function () { onTileTap(tile); });
    poolEl.appendChild(tile);
  });
}

function markNextSlot() {
  const n = state.filled.indexOf(false);
  document.querySelectorAll('.slot').forEach(function (s) { s.classList.toggle('next', Number(s.dataset.index) === n); });
}
function onTileTap(tile) {
  if (tile.classList.contains('used')) return;
  const letter = tile.dataset.letter;
  const slots = document.querySelectorAll('.slot');
  // Spell in reading order (right to left): the letter must match the next
  // empty slot, which glows. A different letter is a gentle "try again".
  let target = null;
  const nextIdx = state.filled.indexOf(false);
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (Number(s.dataset.index) === nextIdx && s.dataset.letter === letter) { target = s; break; }
  }
  if (!target) {
    const nx = document.querySelector('.slot[data-index="' + nextIdx + '"]');
    if (nx) { nx.classList.remove('nudge'); void nx.offsetWidth; nx.classList.add('nudge'); }
    tile.classList.add('wrong');
    state.wrongCount++; state.wordWrong++;
    // Encourage on a wrong tap (a reaction every correct letter would be
    // too noisy in a spelling game — correct letters just get a soft sfx).
    if (window.BabyMo && BabyMo.react) BabyMo.react('wrong');
    setTimeout(function () { tile.classList.remove('wrong'); }, 450);
    return;
  }
  if (window.BabyMo && BabyMo.sfx) BabyMo.sfx('correct');
  flyLetterToSlot(tile, target, letter);
}

function flyLetterToSlot(tile, slot, letter) {
  tile.classList.add('used');
  state.filled[Number(slot.dataset.index)] = 'flying';
  const tileRect = tile.getBoundingClientRect();
  const slotRect = slot.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'flying-letter';
  ghost.textContent = letter;
  ghost.style.left   = tileRect.left + 'px';
  ghost.style.top    = tileRect.top + 'px';
  ghost.style.width  = tileRect.width + 'px';
  ghost.style.height = tileRect.height + 'px';
  document.body.appendChild(ghost);
  requestAnimationFrame(function () {
    const dx = (slotRect.left + slotRect.width / 2) - (tileRect.left + tileRect.width / 2);
    const dy = (slotRect.top  + slotRect.height / 2) - (tileRect.top + tileRect.height / 2);
    ghost.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.85)';
  });
  setTimeout(function () {
    ghost.remove();
    const idx = Number(slot.dataset.index);
    slot.classList.add('filled');
    slot.innerHTML = '<span class="slot-letter" lang="ar">' + letter + '</span>';
    state.filled[idx] = true;
    markNextSlot();
    spawnSparkles(slot, 4);
    speakLetterQuick(letter);
    if (state.filled.every(Boolean)) { onWordComplete(); }
  }, 480);
}

function spawnCelebration(emoji) {
  var config = CELEBRATIONS[emoji] || { emojis: ['✨','⭐','🌟'], style: 'burst', count: 10 };
  var emojiEl = document.getElementById('gameEmoji');
  var rect = emojiEl ? emojiEl.getBoundingClientRect() : null;
  var cx = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
  var cy = rect ? rect.top + rect.height / 2 : window.innerHeight * 0.25;

  for (var i = 0; i < config.count; i++) {
    (function (idx) {
      setTimeout(function () {
        var el = document.createElement('span');
        el.className = 'celebrate celebrate-' + config.style;
        el.textContent = config.emojis[Math.floor(Math.random() * config.emojis.length)];
        el.style.fontSize = (18 + Math.random() * 16) + 'px';
        el.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
        el.style.top = (cy + (Math.random() - 0.5) * 30) + 'px';

        var dx  = (Math.random() - 0.5) * 140;
        var dx2 = dx + (Math.random() - 0.5) * 100;
        var dx3 = dx2 + (Math.random() - 0.5) * 60;
        var dy, dy2;

        if (config.style === 'rise') {
          dy = -(120 + Math.random() * 140);
        } else if (config.style === 'fall') {
          dy = -(40 + Math.random() * 60);
          dx = (Math.random() - 0.5) * 200;
          dx2 = dx + (Math.random() - 0.5) * 80;
        } else if (config.style === 'fly') {
          dx2 = (Math.random() > 0.5 ? 1 : -1) * (90 + Math.random() * 120);
          dy = -(80 + Math.random() * 120);
        } else if (config.style === 'swim') {
          dx = (Math.random() - 0.5) * 180;
          dx2 = dx + (Math.random() > 0.5 ? 1 : -1) * 60;
          dx3 = dx2 + (Math.random() > 0.5 ? 1 : -1) * 40;
          dy = -(20 + Math.random() * 40);
          dy2 = -(40 + Math.random() * 60);
        } else {
          var angle = Math.random() * Math.PI * 2;
          var dist = 80 + Math.random() * 100;
          dy = Math.sin(angle) * dist * 0.7 - 30;
          dy2 = dy * 1.3;
          dx = Math.cos(angle) * dist;
          dx2 = dx * 1.5;
        }

        el.style.setProperty('--dx', dx + 'px');
        el.style.setProperty('--dx2', dx2 + 'px');
        el.style.setProperty('--dx3', dx3 + 'px');
        el.style.setProperty('--dy', (dy || 0) + 'px');
        el.style.setProperty('--dy2', (dy2 || 0) + 'px');
        el.style.setProperty('--rot', (Math.random() - 0.5) * 40 + 'deg');
        el.style.setProperty('--rot2', (Math.random() - 0.5) * 60 + 'deg');
        el.style.setProperty('--dur', (1.2 + Math.random() * 1.0) + 's');

        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 3000);
      }, idx * 60);
    })(i);
  }
}

function onWordComplete() {
  if (state.mode === 'over') return;
  const word = WORDS[state.currentIdx];
  state.completedWords.push(word);
  try{ window.BabyMo&&BabyMo.daily&&BabyMo.daily.mark('arabic-spelling','word'); }catch(e){}
  const saved = saveWord(word, state.wordWrong);
  if (state.mode === 'speed') {
    document.querySelectorAll('.slot').forEach(function (s, i) { setTimeout(function () { spawnSparkles(s, 3); }, i * 60); });
    showToast('⭐'.repeat(saved.stars), '⚡');
    speakArabic(word.arabic, { rate: 0.85 });
    speedNext();
    return;
  }

  const slots = document.querySelectorAll('.slot');
  slots.forEach(function (s, i) {
    setTimeout(function () { spawnSparkles(s, 4); }, i * 80);
  });

  showToast(saved.stars === 3 ? 'Masya Allah! ⭐⭐⭐' : 'Masya Allah! ' + '⭐'.repeat(saved.stars), '✨');

  setTimeout(function () {
    speakWordSequence(
      word,
      function () {
        if (state.mode === 'daily') { finishDaily(word); return; }
        const nextIdx = state.currentIdx + 1;
        const sameSection = nextIdx < WORDS.length &&
                            WORDS[nextIdx].section === word.section;
        if (sameSection) {
          state.currentIdx = nextIdx;
          renderWord();
        } else {
          showCompletion();
        }
      },
      function (letterIndex) {
        const slot = document.querySelector('.slot[data-index="' + letterIndex + '"]');
        if (!slot) return;
        slot.classList.remove('speaking');
        void slot.offsetWidth;
        slot.classList.add('speaking');
        setTimeout(function () { slot.classList.remove('speaking'); }, 600);
      },
      function () {
        spawnCelebration(word.emoji);
        const card = document.getElementById('gameWordCard');
        card.classList.add('speaking-word');
        setTimeout(function () { card.classList.remove('speaking-word'); }, 1600);
      }
    );
  }, 700);
}

/* ----- Share: rich Baby Mo card (bm-kit.js) ----- */
let lastResult = null;
function shareWords() {
  try {
    if (!window.BabyMo || !BabyMo.shareScore) return;
    const r = lastResult || { n: state.completedWords.length, total: state.completedWords.length, stars: 0, wrong: 0, section: '' };
    const T = window.BM_T || function (x) { return x; }; // section name in English (EN only)
    const stats = [[['Kata', 'Words'], r.n + '/' + r.total], [['Salah', 'Mistakes'], String(r.wrong)]];
    if (r.section) stats.push([['Bagian', 'Section'], [r.section, T(r.section)]]);
    BabyMo.shareScore('', r.stars, ['Aku belajar kata-kata Islam bareng Baby Mo! 🔤', 'I learned Islamic words with Baby Mo! 🔤'], {
      headline: [r.n + ' kata!', r.n + (r.n === 1 ? ' word!' : ' words!')],
      starsMax: 3,
      stats: stats
    });
  } catch (e) {}
}

/* ----- Completion ----- */
function showCompletion() {
  cancelSpeech();
  const completedSectionId = WORDS[state.currentIdx].section;
  const sec = getSection(completedSectionId);
  try{ window.BabyMo&&BabyMo.daily&&BabyMo.daily.mark('arabic-spelling','section'); }catch(e){}
  try{ window.BabyMo&&BabyMo.daily&&BabyMo.daily.reward('arabic-spelling','section-'+completedSectionId,1); }catch(e){}
  const next = getNextSection(completedSectionId);

  const tagEl = document.getElementById('completeSectionTag');
  tagEl.firstElementChild.innerHTML = secIcon(sec);
  document.getElementById('completeSectionName').textContent = sec.name;

  const sub = document.getElementById('completeSub');
  if (next) {
    sub.textContent = 'Kamu sudah belajar ' + state.completedWords.length + ' kata ' + sec.name;
  } else {
    sub.textContent = 'Masya Allah! Semua 21 kata selesai ✨';
  }

  document.getElementById('statWords').textContent = state.completedWords.length;
  document.getElementById('statWrong').textContent = state.wrongCount;
  const sst = Math.max(1, Math.round(state.completedWords.length ? 3 - Math.min(2, state.wrongCount / Math.max(1, state.completedWords.length)) : 3));
  document.getElementById('completeStars').textContent = Array(sst).fill('⭐').join(' ') + (sst < 3 ? ' ' + Array(3 - sst).fill('☆').join(' ') : '');
  document.getElementById('statStars').textContent = '⭐'.repeat(sst);
  document.getElementById('completeInfoText').textContent = state.completedWords.length + '/' + getSectionWords(completedSectionId).length + ' Kata';
  lastResult = { n: state.completedWords.length, total: getSectionWords(completedSectionId).length, stars: sst,
    wrong: state.wrongCount, section: sec.name };

  const list = document.getElementById('learnedList');
  list.innerHTML = state.completedWords.map(function (w) {
    return '<div class="learned">' +
      '<span class="learned-emoji" aria-hidden="true">' + wordArt(w) + '</span>' +
      '<span class="learned-arabic" lang="ar">' + w.arabic + '</span>' +
      '<span class="learned-latin">' + w.latin + '</span>' +
      '</div>';
  }).join('');

  const btnReplay = document.getElementById('btnReplay');
  const btnNext   = document.getElementById('btnNext');
  btnReplay.onclick = function (e) {
    spawnSparkles(e.currentTarget, 3);
    setTimeout(function () { startGame(getFirstIdxOfSection(completedSectionId)); }, 180);
  };
  if (next) {
    btnNext.innerHTML = secIcon(next) + ' Lanjut ' + next.name;
    btnNext.onclick = function (e) {
      spawnSparkles(e.currentTarget, 4);
      showToast(next.name + '!', secIcon(next));
      setTimeout(function () { startGame(getFirstIdxOfSection(next.id)); }, 700);
    };
  } else {
    btnNext.textContent = '🏠 Hub';
    btnNext.onclick = function () {
      window.location.href = 'index.html';
    };
  }

  showView('Complete');

  setTimeout(function () {
    const stars = document.getElementById('completeStars');
    spawnSparkles(stars, 8);
  }, 400);
}

/* ----- Wire up ----- */
renderMenu();
document.addEventListener('DOMContentLoaded', decorateMenu);

/* ----- Section chip taps — scroll to section ----- */
document.querySelectorAll('.preview-chip[data-target]').forEach(function (chip) {
  chip.addEventListener('click', function () {
    var target = chip.dataset.target;
    var sectionEl = document.querySelector('.section[data-section="' + target + '"]');
    if (!sectionEl) return;

    document.querySelectorAll('.preview-chip').forEach(function (c) { c.classList.remove('active-chip'); });
    chip.classList.add('active-chip');

    sectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    spawnSparkles(chip, 3);
  });
});

document.getElementById('ctaStart').addEventListener('click', function (e) {
  cancelSpeech();
  spawnSparkles(e.currentTarget, 4);
  showToast('Bismillah!', '🌙');
  setTimeout(function () { startGame(0); }, 700);
});

document.getElementById('btnExitGame').addEventListener('click', function () {
  cancelSpeech(); stopSpeed(); state.mode = 'learn';
  showView('Menu');
});

document.getElementById('btnExitComplete').addEventListener('click', function () {
  cancelSpeech();
  showView('Menu');
});

window.addEventListener('pagehide', cancelSpeech);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) cancelSpeech();
});

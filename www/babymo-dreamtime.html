<style>
:root{
  /* Calming bedtime palette — soft twilight indigo/violet, dreamy & cozy */
  --bg:#1A1740;--bg2:#241E54;--bg3:#120F30;
  --card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.10);
  --green:#6E7BF2;--green-lt:#8C96F7;--green-glow:#B3BCFF;
  --gold:#FFD27A;--gold-lt:#FFE3A8;
  --cream:#F3F1FF;--cream-dim:#A7A3D6;
  --teal:#5BD8E8;--purple:#B98CF0;
  --border:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Nunito','Arial Rounded MT Bold',Arial,sans-serif;}
/* Dreamy layered night-sky backdrop */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 78% 8%, rgba(255,210,122,.16), transparent 60%),
    radial-gradient(ellipse 75% 55% at 18% 12%, rgba(185,140,240,.20), transparent 62%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(110,123,242,.16), transparent 70%),
    linear-gradient(180deg,#241E54 0%,#1A1740 50%,#120F30 100%);}

@keyframes tw{0%,100%{opacity:.06;transform:scale(.7)}50%{opacity:.2;transform:scale(1.3)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes su{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pk{0%{transform:scale(0) rotate(-15deg);opacity:0}65%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1);opacity:1}}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes zf{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
@keyframes bt{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes rp{to{transform:scale(5);opacity:0}}
@keyframes mof{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes starFade{0%{opacity:.03}50%{opacity:.18}100%{opacity:.03}}
@keyframes glowBtn{0%,100%{box-shadow:0 10px 30px -6px rgba(110,123,242,.55)}50%{box-shadow:0 12px 44px -6px rgba(185,140,240,.7),0 0 0 10px rgba(140,150,247,.10)}}
@keyframes shadowBreathe{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.28}}
@keyframes zzFloat{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(1.2)}}
@keyframes bonkSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
.screen.on{display:flex;}

.topbar{display:flex;align-items:center;gap:12px;padding:16px 20px 4px;padding-top:calc(16px + env(safe-area-inset-top));flex-shrink:0;position:relative;z-index:2;}
.ptrack{flex:1;height:10px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green-glow));transition:width .6s;}
.home-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 12px;color:var(--cream-dim);font-size:16px;cursor:pointer;font-family:inherit;transition:.15s;}
.home-btn:active{opacity:.7;}

.shead{text-align:center;padding:10px 24px 0;flex-shrink:0;}
.snum{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--cream-dim);margin-bottom:5px;}
.stitle{font-size:26px;font-weight:900;color:var(--cream);line-height:1.2;}
.shint{font-size:14px;color:var(--cream-dim);margin-top:5px;line-height:1.4;}

.gbtn{
  background:linear-gradient(135deg,var(--green-lt),var(--purple));
  border:none;border-radius:100px;
  padding:18px 52px;
  font-family:inherit;font-size:20px;font-weight:900;
  color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px -6px rgba(110,123,242,.6),inset 0 1px 0 rgba(255,255,255,.3);
  animation:glowBtn 2.5s ease-in-out infinite;
  touch-action:manipulation;
}
.gbtn:active{transform:scale(.97);}

.pjgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px;}
.pjitem{
  background:rgba(255,255,255,.05);
  border:2.5px solid var(--border);
  border-radius:22px;padding:20px 12px;
  text-align:center;cursor:pointer;
  position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  touch-action:manipulation;
}
.pjitem:active{transform:scale(.97);}

.doa-card{
  background:rgba(255,255,255,.04);
  border:2px solid var(--border);
  border-radius:18px;
  padding:14px 16px;
  transition:all .35s;
  position:relative;
  overflow:hidden;
}
.dua-ar.active{color:#fff!important;text-shadow:0 0 18px rgba(255,216,116,.9),0 0 6px rgba(255,216,116,.6);}
/* Doa step progress dots */
.ddot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--cream-dim);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:.3s;}
.ddot.active{background:linear-gradient(135deg,var(--green-lt),var(--purple));color:#fff;transform:scale(1.18);box-shadow:0 0 12px -2px var(--green);}
.ddot.done{background:rgba(109,184,130,.28);color:var(--green-glow);}
.ddot.ddstar.active{background:linear-gradient(135deg,var(--gold),var(--gold-lt));box-shadow:0 0 12px -2px var(--gold);}
.ddot.ddstar.done{background:rgba(200,144,64,.25);color:var(--gold-lt);}
.ddline{width:16px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;}
.doa-card.now-playing{border-color:var(--gold-lt)!important;background:rgba(255,216,116,.10)!important;box-shadow:0 0 0 1px rgba(255,216,116,.4),0 8px 22px -8px rgba(224,184,77,.4);}
.doa-card.played{border-color:rgba(140,150,247,.45);background:rgba(110,123,242,.08);}
.doa-card.combined{border-color:rgba(200,144,64,.25);background:rgba(200,144,64,.05);}
.doa-card.combined.played{border-color:rgba(200,144,64,.55);background:rgba(200,144,64,.1);}

.donebanner{text-align:center;padding:12px 24px;flex-shrink:0;animation:su .5s ease;}
.ripel{position:absolute;border-radius:50%;pointer-events:none;animation:rp .6s ease forwards;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}

.mo-logo{object-fit:contain;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.38));animation:mof 3.6s ease-in-out infinite;}
.mo-shadow{border-radius:50%;background:rgba(18,15,48,.45);filter:blur(4px);animation:shadowBreathe 3.6s ease-in-out infinite;margin:0 auto;}
.mo-head{
  width:72px;height:72px;border-radius:50%;
  object-fit:cover;object-position:top center;
  border:2.5px solid rgba(179,188,255,.35);
  flex-shrink:0;
}

/* tablet/iPad — widen the play area */
@media(min-width:820px){.pjgrid{max-width:680px!important;}}

/* bm-letterbox: comfortable centered column on tablet/desktop */
@media(min-width:760px){.screen{max-width:560px!important;margin-left:auto!important;margin-right:auto!important;left:0!important;right:0!important;}}body{background:#0A0820;}

/* ── Gosok gigi: guided poses ── */
.bsteps{display:flex;justify-content:center;gap:6px;margin:8px 0 2px;flex-shrink:0}
.bsteps i{width:24px;height:24px;border-radius:50%;font-style:normal;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:var(--cream-dim);transition:.3s}
.bsteps i.now{background:#3ECFB8;color:#0E1C2E;transform:scale(1.15);box-shadow:0 0 0 4px rgba(62,207,184,.22)}
.bsteps i.ok{background:rgba(62,207,184,.35);color:#E9FFFB}
.bstage{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:4px auto 0;flex-shrink:1;min-height:150px}
.bglow{position:absolute;inset:6% 6% 0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(126,232,220,.55),rgba(140,150,247,.25) 55%,transparent 72%);opacity:.3;transition:opacity .4s}
.bpose{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 82%,transparent 100%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.bpose.pop{animation:bpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{from{transform:scale(.88);opacity:.4}to{transform:none;opacity:1}}
.bpose.wl{animation:bwl .22s ease}.bpose.wr{animation:bwr .22s ease}.bpose.wu{animation:bwu .22s ease}.bpose.wd{animation:bwd .22s ease}.bpose.sw{animation:bsw .5s ease}
@keyframes bwl{50%{transform:translateX(-4%) rotate(-2deg)}}@keyframes bwr{50%{transform:translateX(4%) rotate(2deg)}}
@keyframes bwu{50%{transform:translateY(-3%)}}@keyframes bwd{50%{transform:translateY(3%)}}
@keyframes bsw{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.bfoam span{position:absolute;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 2px rgba(126,232,220,.5);animation:bfo .9s ease-out forwards;pointer-events:none}
@keyframes bfo{from{transform:scale(.3);opacity:1}to{transform:translateY(-36px) scale(1.2);opacity:0}}
.bspark span{position:absolute;color:#FFE27A;font-size:22px;animation:bsp 1.4s ease-in-out infinite;pointer-events:none;text-shadow:0 0 10px rgba(255,226,122,.8)}
@keyframes bsp{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1.2);opacity:1}}
.blabel b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#8C96F7;color:#fff;font-size:12px;margin-right:4px}
.blabel{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;padding:6px 14px;border-radius:999px;background:rgba(243,241,255,.94);color:#3B3480;font-weight:900;font-size:14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.bplay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px 6px;gap:10px;min-height:0}
.btools{display:flex;gap:12px;width:100%;max-width:320px;justify-content:center}
.btool,.bcup,.bhold{flex:1;min-height:84px;border-radius:22px;border:2px solid var(--border);background:rgba(255,255,255,.07);color:var(--cream);font:inherit;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.btool span,.bcup span,.bhold span{font-size:34px;line-height:1}
.btool.ok,.bcup.ok,.bhold.ok{border-color:#3ECFB8;background:rgba(62,207,184,.18)}
.btool:not(.ok),.bcup:not(.ok){animation:pu 1.8s infinite}
.bhold.press{transform:scale(.95);border-color:#7EE8DC}
.bpaste{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:320px}
.bbrushsvg{width:200px;height:54px}
.bzone{position:relative;border-radius:22px;background:rgba(255,255,255,.05);border:2px solid var(--border);touch-action:none;cursor:grab;overflow:hidden;width:100%;max-width:320px}
.bzone.h{height:96px}.bzone.v{height:150px;max-width:180px}
.bzone.ok{border-color:#3ECFB8}
.bzone .btrack{position:absolute;background:rgba(255,255,255,.1);border-radius:99px}
.bzone.h .btrack{top:50%;left:12px;right:12px;height:2px}.bzone.v .btrack{left:50%;top:12px;bottom:12px;width:2px}
.bbr{position:absolute;left:50%;top:50%;font-size:44px;line-height:1;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 3px 12px rgba(62,207,184,.45))}
.barr{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:22px;color:rgba(255,255,255,.25);animation:pu 1.8s infinite}
.bzone.v .barr{flex-direction:column;padding:6px 0}
.bmeter{width:100%;max-width:320px}
.bmbar{background:rgba(255,255,255,.07);border-radius:99px;height:8px;overflow:hidden;margin-bottom:5px}
.bmbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3ECFB8,#7EE8DC);transition:width .25s}
.bmtxt{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--cream-dim)}.bmtxt b{color:#3ECFB8}
</style>

<style id="bm-dream-loop">
/* Nightly bedtime streak (moon that fills night by night) + story of the night.
   Dreamtime is a night-only look, so these apply in both themes. */
#s-home{overflow-y:auto;-webkit-overflow-scrolling:touch}
#s-home>div{flex:1 0 auto!important}
.moonbox{display:flex;align-items:center;gap:14px;width:100%;max-width:340px;margin:0 auto 14px;padding:12px 14px;border-radius:22px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);text-align:left;cursor:pointer;font:inherit;color:var(--cream)}
.moonbox:active{transform:scale(.98)}
.moonsvg{flex:0 0 64px;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(255,226,140,.35))}
.moonbox .mt{flex:1;min-width:0}
.moonbox .mt b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.moonbox .mt small{display:block;font-size:12.5px;font-weight:700;color:var(--cream-dim);margin-top:3px;line-height:1.3}
.mdots{display:flex;gap:5px;margin-top:7px}
.mdots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14)}
.mdots i.on{background:radial-gradient(circle at 35% 35%,#FFF6CF,#FFD27A);border-color:transparent;box-shadow:0 0 8px rgba(255,210,122,.6)}
.storychip{display:inline-flex;align-items:center;gap:8px;min-height:48px;margin:0 auto 18px;padding:10px 18px;border-radius:999px;
  background:rgba(185,140,240,.16);border:1px solid rgba(185,140,240,.38);color:var(--cream);font:inherit;font-size:14px;font-weight:800;cursor:pointer;max-width:100%}
.storychip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sleepextra{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;width:100%;max-width:340px}
.sleepextra .moonbox{margin:0;background:rgba(255,255,255,.04)}
.fullmoon{font-size:15px;font-weight:900;color:var(--gold-lt);text-align:center;animation:pu 2s ease-in-out infinite}
#storySheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(8,6,24,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#storySheet.on{display:flex}
.storycard{width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));
  background:linear-gradient(170deg,#2A2366,#1A1740 60%,#151236);border:1px solid rgba(255,255,255,.12);border-bottom:none;animation:su .45s ease}
.storycard .sk{font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.storycard h2{font-size:24px;font-weight:900;line-height:1.2;margin:6px 0 10px;color:var(--cream)}
.storycard .sem{width:56px;height:56px;float:right;margin:-4px 0 6px 10px}
.storycard p{font-size:17px;line-height:1.65;color:#E6E3FF;margin-bottom:8px}
.storycard p.read{color:var(--gold-lt)}
.storycard .lesson{clear:both;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,210,122,.10);border:1px dashed rgba(255,210,122,.4);font-size:14px;font-weight:800;color:var(--gold-lt)}
.storybtns{display:flex;gap:10px;margin-top:14px}
.storybtns button{flex:1;min-height:54px;border-radius:18px;font:inherit;font-size:16px;font-weight:900;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.07);color:var(--cream)}
.storybtns .sread{background:linear-gradient(135deg,var(--green-lt),var(--purple));border:none;color:#fff}
@media (min-width:760px){.storycard{border-radius:28px;margin-bottom:24px}}
@media (max-height:500px){.storycard{max-height:100%;padding-top:14px}.storycard p{font-size:15px;line-height:1.45;margin-bottom:4px}.storycard h2{font-size:20px;margin:2px 0 6px}.storycard .sem{font-size:34px}.storycard .lesson{margin-top:6px;padding:6px 10px}.storybtns{margin-top:8px}.storybtns button{min-height:48px}}
@media (orientation:landscape) and (max-height:500px){#sleepcontent{display:grid!important;grid-template-columns:1fr 1fr;justify-items:center;align-content:center;column-gap:24px;row-gap:4px!important}#sleepcontent>*{grid-column:1}#sleepcontent>#sleepExtra{grid-column:2;grid-row:1/span 6;align-self:center;margin:0}#sleepcontent img{width:110px!important;height:110px!important}}

<style id="bm-fresh">
/* Fresh iOS look for the bedtime screens. Dreamtime stays night-themed in
   both hub themes, so this is not a bm-bright block: night glass cards,
   capsule buttons, springy press, Fredoka display type. */
:root{
  --nx-glass:rgba(255,255,255,.08); --nx-glass-2:rgba(255,255,255,.12); --nx-hair:rgba(255,255,255,.12);
  --nx-rim:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.18);
  --nx-shadow:0 18px 40px -22px rgba(4,2,20,.8);
  --nx-blur:blur(20px) saturate(170%);
}
.dt-hero,.stitle,.storycard h2,.dt-night{font-family:'Fredoka','Nunito',sans-serif!important;font-weight:600!important;letter-spacing:-.02em;}
.dt-hero{font-size:38px!important;}
.stitle{font-size:27px;}
.dt-night{color:rgba(243,241,255,.62)!important;}

.home-btn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--cream);
  background:var(--nx-glass)!important;border:1px solid var(--nx-hair)!important;-webkit-backdrop-filter:var(--nx-blur);backdrop-filter:var(--nx-blur);}
.dt-hub{display:inline-flex!important;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;opacity:1!important;

  -webkit-backdrop-filter:var(--nx-blur);backdrop-filter:var(--nx-blur);box-shadow:var(--nx-rim);}
.gbtn{min-height:58px;}

.storybtns button:not(.sread){background:var(--nx-glass-2);border:1px solid var(--nx-hair);box-shadow:var(--nx-rim)!important;}

.moonbox,.storychip,.pjitem,.btool,.bcup,.bhold,.home-btn,.dt-hub,.gbtn,#playAll,#doaLanjut,.storybtns button{
  transition:transform .26s cubic-bezier(.34,1.56,.64,1),background-color .2s,border-color .2s,opacity .35s!important;}
:is(.moonbox,.storychip,.pjitem,.btool,.bcup,.home-btn,.dt-hub,#playAll,#doaLanjut,.storybtns button):active{transform:scale(.95)!important;}
.ptrack{height:6px;background:rgba(255,255,255,.10);}
.blabel{box-shadow:inset 0 1px 0 #fff,0 8px 18px -8px rgba(0,0,0,.55);}
/* story sheet */
#storySheet{background:rgba(8,6,24,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.storycard{background:linear-gradient(170deg,rgba(52,44,120,.86),rgba(26,23,64,.92) 60%,rgba(21,18,54,.95))!important;
  border:1px solid var(--nx-hair);border-bottom:none;border-radius:32px 32px 0 0;
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);box-shadow:var(--nx-rim),0 -20px 50px -20px rgba(0,0,0,.6);}
.storycard::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:-10px auto 12px;}
.storycard .lesson{border-style:solid;border-radius:18px;}
@media (min-width:760px){.storycard{border-radius:32px;border-bottom:1px solid var(--nx-hair);}}

<style id="dt-v2">
/* ── Dreamtime v2: custom glossy icons, pea-sized paste, pyjama closet, cosy bed ── */
.dic{display:block;width:100%;height:100%;overflow:visible}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.stitle{display:flex;align-items:center;justify-content:center;gap:9px}
.stitle .ic{width:34px;height:34px;vertical-align:middle}
.dt-step .ic{width:30px;height:30px}
.dt-hero .ic{width:.95em;height:.95em;margin-left:4px;vertical-align:-.12em}
.dt-lead .ic,.dt-inl .ic{width:18px;height:18px;vertical-align:-3px;margin-left:3px}
.dt-zz{position:absolute;width:30px;height:30px;opacity:.75;animation:zzFloat 2.8s .3s ease-in-out infinite}
.topmoon{width:26px;height:26px}
.btool .ic,.bcup .ic,.bhold .ic{width:44px;height:44px;font-size:0}
/* paste: brush + tube + pea blob */
.bpastesvg{width:min(78vw,260px,32vh);height:auto;overflow:visible}
.tube{transform-box:fill-box;transform-origin:50% 0;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.tube.sq{transform:scale(1.07,.9)}
.tube.up{transform:translate(6px,-16px) rotate(10deg);opacity:.85}
.pjig{transform-origin:0 0}
.blobdone{animation:blobJig .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes blobJig{0%{transform:scale(1.18,.82)}35%{transform:scale(.9,1.12)}65%{transform:scale(1.05,.96)}100%{transform:none}}
.bbr{width:62px;height:62px;font-size:0}
.barr .ic{width:26px;height:26px}
.bspark span{width:24px;height:24px;font-size:0}
.bdone-t{display:inline-flex;align-items:center;gap:8px}
.bdone-t .ic{width:28px;height:28px}
/* ── step 2: pyjama closet ── */
.pjstage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pjspot{position:absolute;left:50%;bottom:5%;width:62%;height:11%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(185,170,255,.45),rgba(110,123,242,.12) 70%,transparent);filter:blur(1px)}
.pjglow{position:absolute;left:50%;top:50%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(140,150,247,.28),rgba(185,140,240,.10) 55%,transparent 70%)}
.pjmo{position:relative;flex:0 0 auto;width:280px;height:280px;z-index:2}
.pjmo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.pjmo.pop img{animation:pjPop .6s cubic-bezier(.3,1.6,.5,1)}
.pjmo.cheer img{animation:pjCheer 1s cubic-bezier(.3,1.5,.5,1) 2}
@keyframes pjPop{0%{transform:scale(1)}30%{transform:scale(1.07,.94)}60%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes pjCheer{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.02,.98)}70%{transform:translateY(0) scale(1.03,.97)}}
.pjcap,.pjted{position:absolute;opacity:0;transform:scale(.3);transition:opacity .3s,transform .55s cubic-bezier(.34,1.56,.64,1);pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pjcap{left:27.7%;top:-.5%;width:40%;transform-origin:50% 70%;z-index:3}
.pjted{left:4%;top:55%;width:32%;transform-origin:50% 100%;z-index:3}
.pjcap.on{opacity:1;transform:rotate(-4deg)}
.pjted.on{opacity:1;transform:rotate(-8deg)}
.pjfx{position:absolute;inset:0;pointer-events:none;z-index:4}
.pjfx i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;animation:pjBurst .8s ease-out forwards}
@keyframes pjBurst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}
.pjchk{display:flex;justify-content:center;gap:10px;flex-shrink:0;padding:2px 0 8px}
.pjchk span{position:relative;width:40px;height:40px;border-radius:50%;padding:7px;background:rgba(255,255,255,.07);border:1px solid var(--nx-hair);transition:background .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.pjchk span .ok{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;opacity:0;transform:scale(.2);transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.pjchk span.done{background:rgba(62,207,184,.2);border-color:rgba(62,207,184,.6);transform:scale(1.08)}
.pjchk span.done .ok{opacity:1;transform:none}
.wardrobe{position:relative;flex-shrink:0;margin:0 auto 14px;width:calc(100% - 32px);max-width:420px;border-radius:26px;padding:12px 12px 10px;
  background:linear-gradient(180deg,#D59A63,#A9663A);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 18px 30px -16px rgba(0,0,0,.7)}
.wardrobe::before{content:'';position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44%;height:18px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,#E0A872,#C3814C);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.wrd-in{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-radius:18px;padding:16px 6px 8px;
  background:linear-gradient(180deg,#5B3A86,#3E2A6E);box-shadow:inset 0 6px 14px rgba(0,0,0,.45)}
.wrd-rail{position:absolute;left:10px;right:10px;top:9px;height:6px;border-radius:3px;background:linear-gradient(180deg,#FFF6D8,#D9B266);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.wrd-shelf{position:absolute;left:6px;right:6px;bottom:8px;height:7px;border-radius:3px;background:linear-gradient(180deg,#E4AA73,#A9663A);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.pjit{position:relative;z-index:1;min-height:96px;border:0;background:none;padding:6px 2px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
  color:var(--cream);font:inherit;font-size:11.5px;font-weight:800;line-height:1.15;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.pjit .lbl{margin-top:auto}
.pjit .art{position:relative;width:58px;height:58px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.pjit .hook{position:absolute;left:50%;top:-12px;width:30px;height:16px;transform:translateX(-50%)}
.pjit:not(.used) .art{animation:pjSway 3s ease-in-out infinite;transform-origin:50% 0}
.pjit:nth-child(4) .art{animation-delay:-.7s}.pjit:nth-child(5) .art{animation-delay:-1.4s}.pjit:nth-child(6) .art{animation-delay:-2.1s}
@keyframes pjSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pjit:active .art{transform:scale(.92)}
.pjit.used .art{opacity:.22;filter:grayscale(.6)}
.pjit .tick{position:absolute;right:8px;top:4px;width:24px;height:24px;opacity:0;transform:scale(.2);transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.pjit.used .tick{opacity:1;transform:none}
.pjfly{position:fixed;z-index:60;pointer-events:none;width:64px;height:64px;margin:-32px 0 0 -32px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.pjdone-t{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;background:rgba(26,23,64,.82);border:1px solid rgba(255,227,168,.35);box-shadow:0 10px 24px -12px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:22px;font-weight:900;color:var(--gold-lt)}
.pjdone-t .ic{width:30px;height:30px}
/* ── step 4: cosy bed ── */
.bedwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px 18px;touch-action:none;cursor:grab;outline:none}
.bedscene{position:relative;width:300px;height:390px;border-radius:30px;overflow:hidden;box-shadow:0 24px 50px -24px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.08)}
.bedscene>svg,.bedscene>img,.bedscene>.bedmo{position:absolute;inset:0;width:100%;height:100%}
.bedmo{pointer-events:none}
.bedmo img{position:absolute;left:7%;top:18%;width:90%;height:auto;transition:opacity .6s ease;filter:drop-shadow(0 4px 6px rgba(20,12,60,.35))}
.bedmo .sleep{opacity:0}
.bedscene.asleep .bedmo .sleep{opacity:1}.bedscene.asleep .bedmo .awake{opacity:0}
.bedmo.breathe{animation:bedBreathe 3.6s ease-in-out infinite;transform-origin:50% 40%}
@keyframes bedBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.018)}}
.bedfx{pointer-events:none}
#bedDim{transition:opacity 1.4s ease}
#bedLamp{transition:opacity 1.4s ease}
.twk{opacity:.35;transform-box:fill-box;transform-origin:center}
.bedscene.asleep .twk{animation:twk 1.8s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
.bedzz{position:absolute;left:66%;top:24%;width:0;height:0;pointer-events:none}
.bedzz b{position:absolute;left:0;top:0;font:900 24px/1 'Fredoka','Nunito',sans-serif;color:#FFE7A3;opacity:0;text-shadow:0 0 10px rgba(185,170,255,.8)}
.bedscene.asleep .bedzz b{animation:bedZ 3s ease-in infinite}
.bedzz b:nth-child(2){font-size:30px;animation-delay:1s!important}.bedzz b:nth-child(3){font-size:38px;animation-delay:2s!important}
@keyframes bedZ{0%{opacity:0;transform:translate(0,0) scale(.6) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translate(34px,-80px) scale(1.15) rotate(8deg)}}
.bedhint{position:absolute;left:50%;top:0;width:58px;height:110px;margin-left:-29px;pointer-events:none;transition:opacity .35s}
.bedhint.off{opacity:0}
.bedhint .hh{position:absolute;left:8px;bottom:0;width:46px;height:46px;animation:bedHand 1.9s cubic-bezier(.45,0,.3,1) infinite}
.bedhint .ar{position:absolute;left:14px;top:0;width:30px;height:60px;color:#FFE3A8;animation:bedArr 1.9s ease-in-out infinite}
@keyframes bedHand{0%{transform:translateY(0);opacity:0}15%{opacity:1}70%{transform:translateY(-52px);opacity:1}100%{transform:translateY(-58px);opacity:0}}
@keyframes bedArr{0%,100%{opacity:.35;transform:translateY(6px)}50%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){
  .pjit .art,.pjmo img,.bedmo,.bedscene.asleep .twk,.bedhint .hh,.bedhint .ar,.dt-zz,.blobdone{animation:none!important}
  .bedscene.asleep .bedzz b{animation:none!important;opacity:.9}
  .bedscene.asleep .bedzz b:nth-child(1){transform:translate(4px,-6px)}.bedscene.asleep .bedzz b:nth-child(2){transform:translate(18px,-30px)}.bedscene.asleep .bedzz b:nth-child(3){transform:translate(32px,-58px)}
  .pjfx i{animation-duration:.01s}
}
</style>

/* Brush bristle sound */
function playBrushSound(){
  var ctx=getACtx();if(!ctx)return;
  try{
    var dur=0.09;
    var bufSize=Math.floor(ctx.sampleRate*dur);
    var buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    var data=buf.getChannelData(0);
    for(var i=0;i<bufSize;i++) data[i]=(Math.random()*2-1);
    var src=ctx.createBufferSource();src.buffer=buf;
    var bpf=ctx.createBiquadFilter();bpf.type='bandpass';bpf.frequency.value=3200;bpf.Q.value=1.2;
    var lpf=ctx.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=5500;
    var gain=ctx.createGain();
    gain.gain.setValueAtTime(0.28,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(bpf);bpf.connect(lpf);lpf.connect(gain);gain.connect(ctx.destination);
    src.start(ctx.currentTime);src.stop(ctx.currentTime+dur);
  }catch(e){}
}

/* ── LULLABY ── */
var LUL=(function(){
  var ctx,gain,on=false,tm,ni=0,nt=0;
  var N=[[196,.8],[220,.8],[247,.6],[196,.2],[220,.9],[294,.8],[330,.6],[294,.2],[220,.8],[196,.6],[247,.4],[196,.2],[165,1.4],[0,.5],[196,.7],[220,.7],[247,.5],[294,.7],[330,.9],[294,.6],[247,.6],[220,.6],[196,1.7],[0,.9]];
  function note(f,s,d){
    if(!f||!gain)return;
    var o=ctx.createOscillator(),e=ctx.createGain(),fl=ctx.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=480;
    o.type='sine';o.frequency.value=f;
    o.connect(fl);fl.connect(e);e.connect(gain);
    e.gain.setValueAtTime(0,s);
    e.gain.linearRampToValueAtTime(.5,s+Math.min(.07,d*.15));
    e.gain.exponentialRampToValueAtTime(.001,s+d-.05);
    o.start(s);o.stop(s+d);
  }
  function tick(){
    while(nt<ctx.currentTime+.7){var n=N[ni%N.length];note(n[0],nt,n[1]);nt+=n[1];ni++;}
    if(on)tm=setTimeout(tick,200);
  }
  return{
    start:function(){
      if(on)return;
      try{
        ctx=new(window.AudioContext||window.webkitAudioContext)();
        gain=ctx.createGain();
        gain.gain.setValueAtTime(0,ctx.currentTime);
        gain.gain.linearRampToValueAtTime(.2,ctx.currentTime+7);
        gain.connect(ctx.destination);
        nt=ctx.currentTime+1.2;ni=0;on=true;tick();
      }catch(e){}
    },
    stop:function(){on=false;clearTimeout(tm);}
  };
})();

    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.08);}}catch(e){}

function buildBrush(wrap,done){

  function next(){

  /* 1 — tap the brush and the toothpaste */
  function phTools(){

  function phPaste(){

      +'<path d="M-15.6 12H15.6L14.8 23Q0 25.5-14.8 23Z" fill="url(#dgMint)"/><rect x="-12" y="3" width="3.6" height="28" rx="1.8" fill="#fff" opacity=".9"/>'
      +'<rect x="-5" y="34" width="10" height="7" rx="2" fill="#D8D2FF"/><rect x="-3.6" y="40" width="7.2" height="4" rx="1.6" fill="#BDB2F7"/></g></g>'

    var hold=document.getElementById('bhold'), blob=document.getElementById('pblob'), tube=document.getElementById('ptube');

  /* 3 & 4 — swipe strokes (horizontal, then vertical) */

      +'<div class="barr">'+(vert?ic('chev','','transform:rotate(-90deg)')+ic('chev','','transform:rotate(90deg)'):ic('chev','','transform:rotate(180deg)')+ic('chev'))+'</div></div>'+meter(vert?'Atas – bawah':'Kiri – kanan');

  function fitMo(){ var r=stage.getBoundingClientRect(); var z=Math.round(Math.max(180,Math.min(r.height*1.12, r.width*.96, 520))); mo.style.width=mo.style.height=z+'px'; mo.style.marginTop=Math.round(z*.06)+'px'; }

  function targetPt(it){ var r=mo.getBoundingClientRect(); return [r.left+r.width*it.at[0]/100, r.top+r.height*it.at[1]/100]; }
  function burst(xp,yp,n){

  function wear(i){

    btn.addEventListener('pointerdown',function(e){ if(btn.classList.contains('used'))return; e.preventDefault(); st={x:e.clientX,y:e.clientY,drag:false,el:null}; try{btn.setPointerCapture(e.pointerId);}catch(_){} });
    btn.addEventListener('pointermove',function(e){
      if(!st)return;
      if(!st.drag&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){ st.drag=true; st.el=document.createElement('div'); st.el.className='pjfly'; st.el.innerHTML=IC[items[i].icon]; document.body.appendChild(st.el); btn.querySelector('.art').style.opacity='.25'; }
      if(st.drag) st.el.style.transform='translate('+e.clientX+'px,'+e.clientY+'px) scale(1.15)';
    });
    function up(e){
      if(!st)return; var s=st; st=null;
      if(!s.drag){ var c=center(btn); use(c[0],c[1]); return; }
      btn.querySelector('.art').style.opacity='';
      var r=mo.getBoundingClientRect(), pad=30;
      if(e.type!=='pointercancel'&&e.clientX>r.left-pad&&e.clientX<r.right+pad&&e.clientY>r.top-pad&&e.clientY<r.bottom+pad){ use(e.clientX,e.clientY,s.el); }
      else { var c2=center(btn), el=s.el;
        if(RM||!el.animate){ el.remove(); return; }
        el.animate([{transform:'translate('+e.clientX+'px,'+e.clientY+'px) scale(1.15)'},{transform:'translate('+c2[0]+'px,'+c2[1]+'px) scale(1)'}],{duration:380,easing:'cubic-bezier(.34,1.4,.64,1)'}).onfinish=function(){el.remove();}; }
    }
    btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up);
    btn.addEventListener('click',function(e){ if(e.detail===0){ var c=center(btn); use(c[0],c[1]); } });   // keyboard
  });
}

/* ══════════════════════════════════════════
   STEP 3 — BACA DOA
   FIX: renamed params to avoid shadowing speakAr()
   FIX: safety timeout so anyPlaying never gets stuck
   FIX: combined card badge flows inside scroll
══════════════════════════════════════════ */
function buildDoa(wrap,done){

  var PARTS=[
    {ar:'بِاسْمِكَ اللَّهُمَّ أَحْيَا', lat:'Bismika Allāhumma aḥyā', mean:'Dengan nama-Mu ya Allah aku hidup', sAr:'باسمك اللهم أحيا', sId:'Bismika Allāhumma ahyā', clip:'doa-voice/d-sleep-1.mp3?v=algenib'},

  ];
  var FULL={ar:'بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ', lat:'Bismika Allāhumma aḥyā wa bismika amūtu', mean:'Dengan nama-Mu ya Allah aku hidup dan dengan nama-Mu aku mati', sAr:'باسمك اللهم أحيا وباسمك أموت', sId:'Bismika Allāhumma ahyā wa bismika amūt', clip:'doa-voice/d-sleep.mp3?v=algenib'};
  var STEPS=[PARTS[0],PARTS[1],FULL];
  var doneAll=false, playing=false;

  var WAVE='<div style="width:3px;height:6px;border-radius:2px;background:rgba(200,144,64,.55);animation:wv .44s 0s ease-in-out infinite;transform-origin:bottom;"></div>'
    +'<div style="width:3px;height:12px;border-radius:2px;background:rgba(200,144,64,.6);animation:wv .52s .08s ease-in-out infinite;transform-origin:bottom;"></div>'
    +'<div style="width:3px;height:17px;border-radius:2px;background:rgba(200,144,64,.65);animation:wv .48s .16s ease-in-out infinite;transform-origin:bottom;"></div>'
    +'<div style="width:3px;height:12px;border-radius:2px;background:rgba(200,144,64,.6);animation:wv .56s .06s ease-in-out infinite;transform-origin:bottom;"></div>'
    +'<div style="width:3px;height:6px;border-radius:2px;background:rgba(200,144,64,.5);animation:wv .44s .12s ease-in-out infinite;transform-origin:bottom;"></div>';

  wrap.innerHTML=
    '<div class="shead" style="padding-bottom:4px;"><div class="snum">Langkah 3 dari 4</div><div class="stitle">'+ic('hands')+'Baca Doa</div></div>'
    +'<div style="flex:1;display:flex;flex-direction:column;min-height:0;padding:2px 18px 14px;gap:10px;">'

      /* Baby Mo + speech bubble */
      +'<div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">'
      +'<img src="baby-mo-poses/baby-mo-thank-you.webp" alt="Baby Mo" class="mo-head" style="width:50px;height:50px;">'
      +'<div style="flex:1;background:rgba(44,90,62,.18);border:1px solid rgba(93,170,120,.22);border-radius:0 14px 14px 14px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--cream);line-height:1.45;">Dengarkan doanya, lalu tirukan pelan-pelan ya sayang'+ic('moon','','margin-left:4px;width:15px;height:15px')+'</div>'
      +'</div>'

      /* STAGE — one Arabic that changes naturally as the doa plays */
      +'<div id="doaStage" style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:22px;padding:14px 16px;position:relative;overflow:hidden;">'
      +'<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(200,144,64,.07),transparent 70%);pointer-events:none;"></div>'
      +'<div style="display:flex;gap:7px;align-items:center;z-index:1;">'
      +'<span class="ddot" data-d="0">1</span><span class="ddline"></span><span class="ddot" data-d="1">2</span><span class="ddline"></span><span class="ddot ddstar" data-d="2">★</span>'
      +'</div>'
      +'<div id="stageAr" class="dua-ar" style="font-family:\'Scheherazade New\',serif;font-size:clamp(24px,7vw,34px);font-weight:700;color:var(--gold-lt);direction:rtl;line-height:1.7;z-index:1;transition:opacity .25s;">'+FULL.ar+'</div>'
      +'<div id="stageLat" style="font-size:14px;font-weight:700;color:var(--green-glow);font-style:italic;z-index:1;transition:opacity .25s;">'+FULL.lat+'</div>'
      +'<div id="stageMean" style="font-size:12.5px;color:var(--cream-dim);line-height:1.45;z-index:1;transition:opacity .25s;">'+FULL.mean+'</div>'
      +'<div id="doaWave" style="display:none;justify-content:center;align-items:flex-end;height:18px;gap:3px;z-index:1;margin-top:2px;">'+WAVE+'</div>'
      +'</div>'

      /* Play-all */
      +'<button id="playAll" style="flex-shrink:0;width:100%;background:linear-gradient(135deg,var(--green-lt),var(--purple));border:none;border-radius:16px;padding:14px;font-family:inherit;font-size:16px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 8px 24px -6px rgba(110,123,242,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,opacity .2s;">▶ Dengar Semua &amp; Tirukan</button>'

      /* Continue */
      +'<button id="doaLanjut" disabled style="flex-shrink:0;width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-lt));border:none;border-radius:16px;padding:14px;font-family:inherit;font-size:16px;font-weight:900;color:#3A2A10;cursor:pointer;box-shadow:0 8px 24px -6px rgba(200,144,64,.5);opacity:.38;transition:opacity .35s;">'+ic('hands','','width:24px;height:24px;margin-right:6px;vertical-align:-6px')+'Aamiin — Lanjut Tidur</button>'

    +'</div>';

  function setStage(s){
    var ar=document.getElementById('stageAr'),lat=document.getElementById('stageLat'),mn=document.getElementById('stageMean');
    if(!ar)return;
    ar.style.opacity='0';lat.style.opacity='0';mn.style.opacity='0';
    setTimeout(function(){
      ar.textContent=s.ar; lat.textContent=s.lat; mn.textContent=s.mean;
      ar.style.opacity='1';lat.style.opacity='1';mn.style.opacity='1';
    },170);
  }
  function dot(i,cls){var d=document.querySelector('.ddot[data-d="'+i+'"]');if(d){d.classList.remove('active','done');if(cls)d.classList.add(cls);}}
  function wave(on){var w=document.getElementById('doaWave');if(w)w.style.display=on?'flex':'none';}
  function arHL(on){var ar=document.getElementById('stageAr');if(ar)ar.classList.toggle('active',on);}

  /* One reusable <audio> for every part. It is started inside the tap (iOS /
     WebView autoplay rules then let the SAME element play parts 2 and 3 from
     timers — a fresh `new Audio()` for each part was blocked once the tap's
     activation ran out, so the last part never played). Each part moves on
     only at the audio's real 'ended'; the watchdog only catches a clip that
     never starts or truly stalls, it never cuts one that is still playing. */
  var au=window.__dreamAu;
  if(!au){ au=window.__dreamAu=new Audio(); au.preload='auto'; try{au.setAttribute('playsinline','');au.playsInline=true;}catch(e){} }
  function speakStep(s,cb){
    playing=true; wave(true); arHL(true);
    /* one voice only: the recorded Arabic du'a (same voice as Doa Harian). Device speech is just a fallback. */
    if(s.clip && !s.noClip){
      var fin=false, started=false, lastT=-1, still=0, t0=Date.now();
      var cleanup=function(){ clearInterval(wd); au.onended=au.onerror=au.onplaying=null; };
      var end=function(){ if(fin) return; fin=true; cleanup(); playing=false; wave(false); arHL(false); if(cb)cb(); };
      var fb=function(){ if(fin) return; fin=true; cleanup(); try{au.pause();}catch(e){} playing=false; s.noClip=true; speakStep(s,function(){ s.noClip=false; if(cb)cb(); }); };
      var wd=setInterval(function(){
        if(fin) return;
        if(!started){ if(Date.now()-t0>8000) fb(); return; }                 // never started (blocked / offline)
        var d=au.duration;
        if(au.ended || (au.paused && isFinite(d) && au.currentTime>=d-0.06)){ end(); return; }   // 'ended' was missed
        if(au.currentTime!==lastT){ lastT=au.currentTime; still=0; } else if(++still>=10) end();   // truly stalled 5 s
      },500);
      try{ speechSynthesis.cancel(); }catch(e){}
      au.onplaying=function(){ started=true; };
      au.onended=end;
      au.onerror=function(){ started?end():fb(); };
      try{
        au.pause(); au.src=s.clip; au.playbackRate=au.defaultPlaybackRate=1; au.currentTime=0;
        var pr=au.play(); if(pr&&pr.catch) pr.catch(function(e){ if(e&&e.name==='AbortError') return; fb(); });
      }catch(e){ fb(); }
      return;
    }
    var safety=setTimeout(function(){playing=false;wave(false);arHL(false);if(cb)cb();},13000);
    speakMom(s.sId,function(){
      setTimeout(function(){
        speakAr(s.sAr,function(){
          clearTimeout(safety); playing=false; wave(false); arHL(false); if(cb)cb();
        });
      },350);
    });
  }

  function runAll(){
    if(playing)return;
    var pa=document.getElementById('playAll');
    pa.disabled=true; pa.style.opacity='.6'; pa.textContent='▶ Sedang diputar...'; pa.style.animation='';
    function go(i){
      if(i>=STEPS.length){
        doneAll=true;
        pa.disabled=false; pa.style.opacity='1'; pa.textContent='🔁 Dengar Lagi';
        var lj=document.getElementById('doaLanjut');

      setStage(STEPS[i]);
      var say=function(){ speakStep(STEPS[i],function(){ dot(i,'done'); setTimeout(function(){go(i+1);},450); }); };
      if(i===0) say(); else setTimeout(say,230);   // part 1 starts inside the tap, unlocking the audio element
    }
    go(0);
  }
  document.getElementById('playAll').addEventListener('click',runAll);

  document.getElementById('doaLanjut').addEventListener('click',function(){
    if(!doneAll)return;
    speechSynthesis.cancel(); try{au.pause();}catch(e){}
    wrap.innerHTML=
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;">'
      +'<div style="width:72px;height:72px;margin-bottom:12px;animation:fl 2s ease-in-out infinite;">'+IC.hands+'</div>'
      +'<div style="font-size:26px;font-weight:900;color:var(--gold-lt);margin-bottom:8px;">Aamiin ya Rabb...</div>'
      +'<div style="font-family:\'Scheherazade New\',serif;font-size:22px;color:var(--gold);direction:rtl;margin-bottom:10px;">بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ</div>'
      +'<div style="font-size:14px;color:var(--cream-dim);line-height:1.6;">Bismika Allāhumma aḥyā wa bismika amūtu<br><span style="font-size:12px;opacity:.7;">Dengan nama-Mu ya Allah aku hidup dan dengan nama-Mu aku mati</span></div>'
      +'<div style="margin-top:16px;font-size:15px;font-weight:800;color:var(--green-glow);">Masya Allah, kamu sudah hafal doanya!'+ic('star','','margin-left:5px;width:20px;height:20px;vertical-align:-3px')+'</div>'
      +'</div>';
    vib([60,30,60,30,100]);
    setTimeout(done,2200);
  });
}

/* ══════════════════════════════════════════
   STEP 4 — TARIK SELIMUT: a cosy bed. The quilt follows the finger with a

function buildBlanket(wrap,done){

  var room=
    '<svg viewBox="0 0 300 390" aria-hidden="true">'

    /* window with the moon */
    +'<g transform="translate(206 18)"><rect x="-4" y="-4" width="80" height="78" rx="20" fill="url(#bgHead)"/><rect x="2" y="2" width="68" height="66" rx="15" fill="#151046"/>'
    +'<path d="M48 14a14 14 0 1 0 12 19 11 11 0 1 1-12-19Z" fill="url(#dgGold)"/>'
    +twinkle(18,20,4.5,0)+twinkle(28,48,3,.6)+twinkle(56,56,3.4,1.1)
    +'<path d="M36 2v66M2 35h68" stroke="url(#bgHead)" stroke-width="4"/><rect x="6" y="5" width="10" height="26" rx="5" fill="#fff" opacity=".08"/></g>'

  var sc=document.getElementById('bsc'), dz=document.getElementById('dz'), hint=document.getElementById('bhn');

  function fit(){

  /* the scalloped, finger-bulged, rumpled top edge as a smooth path */
  function edge(Y,off){
    var pts=[], N=12, L=16, R=284, rump=Math.min(9,Math.abs(v)*7+fling);
    for(var i=0;i<=N;i++){
      var x=L+(R-L)*i/N, y=Y+off;

      var a=pts[j], b=pts[j+1], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2-3.2;
      d+=' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1);
    }
    return {d:d,pts:pts};
  }
  function rev(pts){ var d=''; for(var i=pts.length-1;i>=0;i--) d+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1); return d; }
  function draw(){
    var Y=Y0+(Y1-Y0)*p;
    var top=edge(Y,0), cuffB=edge(Y,22), shB=edge(Y,30);
    var body=top.d+' L286 '+(BOT-8)+' Q286 '+BOT+' 276 '+BOT+' L24 '+BOT+' Q14 '+BOT+' 14 '+(BOT-8)+' Z';

    E.cuff.setAttribute('d',top.d+rev(cuffB.pts)+' Z');
    E.cuffSh.setAttribute('d',cuffB.d+rev(shB.pts)+' Z');
    E.pipe.setAttribute('d',edge(Y,17).d);
    E.shine.setAttribute('d',edge(Y,4).d.replace(/^M[\d. -]+/,function(m){return m;}));
    E.shine.setAttribute('stroke-dasharray','0 36 120 400');
    pat.setAttribute('patternTransform','translate(0 '+(Y+8).toFixed(1)+')');
    var fo=Math.min(.55,.12+Math.abs(v)*.5+fling*.05), lean=Math.max(-24,Math.min(24,v*-16));

      var y0=Y+32, len=Math.max(18,(BOT-y0)*.45), x=q[0];
      E.folds[k].setAttribute('d','M'+x+' '+y0.toFixed(1)+' Q'+(x+lean+(k-1)*6)+' '+(y0+len*.5).toFixed(1)+' '+(x+lean*.4)+' '+(y0+len).toFixed(1));

  }
  function step(ts){
    var dt=last?Math.min(.034,(ts-last)/1000):1/60; last=ts;
    var k,z;
    if(dragging){ k=900; z=.85; } else if(target===1){ k=170; z=RM?1:.42; } else { k=130; z=RM?1:.78; }
    var c=2*Math.sqrt(k)*z;
    v+=(k*(target-p)-c*v)*dt; p+=v*dt;
    if(!dragging) bulge*=Math.pow(.02,dt); else bulge+=(9-bulge)*Math.min(1,dt*10);
    fling*=Math.pow(.05,dt); phase+=dt*(2+Math.abs(v)*6);
    if(RM){ bulge=Math.min(bulge,4); fling=0; }
    draw();
    if(!dragging&&Math.abs(target-p)<.002&&Math.abs(v)<.01&&bulge<.2&&fling<.05){

      if(target===1&&!finished) finish();
      if(target===0&&!finished) hint.classList.remove('off');
      return;
    }
    raf=requestAnimationFrame(step);
  }
  function kick(){ if(!raf){ last=0; raf=requestAnimationFrame(step); } }

  function finish(){
    if(finished)return; finished=true; vib([80,40,120]); sparkleSound();
    hint.classList.add('off'); sc.classList.add('asleep');
    E.dim.setAttribute('opacity','.5'); E.lamp.style.opacity='.12';

    var h=document.getElementById('blh'); if(h) h.textContent='Baby Mo sudah tidur...';
    setTimeout(done,2300);
  }
  function release(){
    if(!dragging)return; dragging=false;
    var vel=(lastMoveP-startP)/Math.max(.05,(performance.now()-lastMoveT)/1000);   // not used for direction alone

  }
  dz.addEventListener('pointerdown',function(e){
    if(finished)return; e.preventDefault();
    dragging=true; startY=e.clientY; startP=p; target=p; hint.classList.add('off'); fit();
    var r=sc.getBoundingClientRect(); fx=Math.max(30,Math.min(270,(e.clientX-r.left)/r.width*W));

    lastMoveT=performance.now(); lastMoveP=p; kick();

  dz.addEventListener('pointermove',function(e){
    if(!dragging||finished)return;
    var t=startP+(startY-e.clientY)/pxPerUnit;
    if(t>1) t=1+(t-1)*.25; if(t<0) t*=.25;                               // rubber band past the ends
    target=t;
    var r=sc.getBoundingClientRect(); fx+=((e.clientX-r.left)/r.width*W-fx)*.35;
    lastMoveT=performance.now(); lastMoveP=p; kick();
  });
  dz.addEventListener('pointerup',release); dz.addEventListener('pointercancel',release); dz.addEventListener('lostpointercapture',release);
  dz.addEventListener('keydown',function(e){
    if(finished)return;
    if(e.key==='ArrowUp'||e.key===' '||e.key==='Enter'){ e.preventDefault(); hint.classList.add('off'); target=1; fling=4; kick(); }
  });
  window.addEventListener('resize',function(){ if(document.body.contains(sc)){ fit(); draw(); } });
  fit(); draw();
  requestAnimationFrame(function(){ fit(); draw(); });
}

<script>
/* ══════════════════════════════════════════
   NIGHTLY BEDTIME STREAK + STORY OF THE NIGHT
   • Each night the routine reaches the sleep screen counts once. Nights before
     05:00 belong to the evening before. The moon fills one phase a night; on the
     7th night in a row it is a full moon (+3 ⭐ via BabyMo.daily.reward).
   • A short, gentle story changes every night (date-seeded shuffle bag).
   Storage: bm_dream_v1 = {v:1, last:'YYYY-MM-DD', count:n, best:n, moons:n, nights:[…]}
══════════════════════════════════════════ */
(function(){
  var EN = window.BM_LANG === 'en';
  function L(id, en){ return EN ? en : id; }
  var KEY = 'bm_dream_v1';
  function kit(){ return (window.BabyMo && BabyMo.daily) ? BabyMo.daily : null; }
  function fmt(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function shift(ds, n){
    try{ var k = kit(); if(k) return k.shift(ds, n); }catch(e){}
    var a = ds.split('-').map(Number); return fmt(new Date(a[0], a[1]-1, a[2]+n, 12));
  }
  function today(){ try{ var k = kit(); if(k) return k.today(); }catch(e){} return fmt(new Date()); }
  /* the "night" a bedtime belongs to: before 05:00 it is still last night */
  function night(){ var t = today(); return new Date().getHours() < 5 ? shift(t, -1) : t; }
  function load(){
    try{ var d = JSON.parse(localStorage.getItem(KEY) || '{}'); if(d && d.v === 1) { d.nights = d.nights || []; return d; } }catch(e){}
    return { v:1, last:null, count:0, best:0, moons:0, nights:[] };
  }
  function save(d){ d.nights = d.nights.slice(-30); try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
  /* streak that is still alive tonight (0 when a night was missed) */
  function alive(d){ var n = night(); return (d.last === n || d.last === shift(n, -1)) ? d.count : 0; }

  function recordNight(){
    var d = load(), n = night(), res = { isNew:false, full:false, d:d };
    if (d.last === n) return res;
    d.count = (d.last === shift(n, -1)) ? d.count + 1 : 1;
    d.last = n; d.best = Math.max(d.best || 0, d.count); d.nights.push(n);
    res.isNew = true;
    if (d.count % 7 === 0) {
      d.moons = (d.moons || 0) + 1; res.full = true;

    var gid = 'mlit' + (++moonN);

    else if (f >= .999) lit = '<circle cx="0" cy="0" r="'+r+'" fill="url(#'+gid+')"/>';
    else lit = '<path d="M0 '+(-r)+' A'+r+' '+r+' 0 0 1 0 '+r+' A'+rx.toFixed(2)+' '+r+' 0 0 '+sweep+' 0 '+(-r)+'Z" fill="url(#'+gid+')"/>';
    return '<svg class="moonsvg" viewBox="-32 -32 64 64" aria-hidden="true"><defs><radialGradient id="'+gid+'" cx="35%" cy="35%"><stop offset="0" stop-color="#FFF8DA"/><stop offset="1" stop-color="#FFD27A"/></radialGradient></defs>'
      + '<circle cx="0" cy="0" r="'+r+'" fill="#2C2770" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>' + lit
      + (f >= .999 ? '<circle cx="-8" cy="-6" r="4" fill="#F2D58A" opacity=".55"/><circle cx="7" cy="9" r="3" fill="#F2D58A" opacity=".5"/><circle cx="9" cy="-10" r="2" fill="#F2D58A" opacity=".45"/>' : '')
      + '</svg>';
  }
  function moonHtml(d, sleepView){
    var c = alive(d), ph = c === 0 ? 0 : ((c - 1) % 7) + 1;   // 1..7 nights into this moon
    var dots = ''; for (var i = 1; i <= 7; i++) dots += '<i class="'+(i <= ph ? 'on' : '')+'"></i>';
    var title = c ? (c + ' ' + L('malam berturut-turut', c === 1 ? 'night in a row' : 'nights in a row')) : L('Mulai bulan malammu', 'Start your bedtime moon');
    var FMI = ic('fullmoon', 'dt-inl');

    if (d.moons && !sleepView) sub += ' · ' + FMI + '×' + d.moons;
    return moonSvg(ph / 7) + '<span class="mt"><b>'+title+'</b><small>'+sub+'</small><span class="mdots">'+dots+'</span></span>';

  var STORIES = [

      en:['That night the rain fell softly.','Baby Mo saw a little kitten shivering on the porch.','He fetched a soft towel, wrapped it gently and whispered, "Bismillah, you are safe now."','The kitten purred, warm and cosy, and Baby Mo smiled.'],

      l:['Berdoa sebelum tidur membuat hati tenang.','A du\'a before sleep makes the heart calm.'] },
    { e:'🐜', t:['Semut yang Rajin','The Busy Ants'],
      id:['Di taman, Baby Mo melihat barisan semut kecil.','Mereka membawa remah roti bersama-sama, saling menolong.','"Kalau bekerja sama, yang berat jadi ringan," pikir Baby Mo.','Malam ini ia berjanji membantu Bunda merapikan mainan besok.'],
      en:['In the garden Baby Mo saw a line of tiny ants.','They carried a breadcrumb together, helping one another.','"When we work together, heavy things feel light," thought Baby Mo.','Tonight he promised to help Mum tidy the toys tomorrow.'],
      l:['Bekerja sama membuat semuanya lebih mudah.','Working together makes things easier.'] }
  ];
  function rng(str){
    try{ var k = kit(); if(k) return k.seed(str); }catch(e){}
    var h = 2166136261; for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    var a = h >>> 0;
    return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function bag(cycle){
    var r = rng('dream-story|' + cycle), o = STORIES.map(function(_, i){ return i; });
    for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = o[i]; o[i] = o[j]; o[j] = t; }
    return o;
  }
  /* a new story every night; each one once per cycle, never two nights in a row */
  function storyFor(ds){
    var a = ds.split('-').map(Number), day = Math.round(Date.UTC(a[0], a[1]-1, a[2]) / 864e5), n = STORIES.length;
    var cyc = Math.floor(day / n), b = bag(cyc), prev = bag(cyc - 1)[n - 1];
    if (b[0] === prev) { var t = b[0]; b[0] = b[1]; b[1] = t; }
    return STORIES[b[day - cyc * n]];
  }
  function tonight(){ return storyFor(night()); }

  var reading = false;
  function stopRead(){ reading = false; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('#storyCard p').forEach(function(p){ p.classList.remove('read'); }); var b = document.getElementById('sRead'); if (b) b.textContent = '🔊 ' + L('Bacakan', 'Read aloud'); }
  function readAloud(){
    if (reading) { stopRead(); return; }
    if (!window.speechSynthesis) return;
    var st = tonight(), lines = EN ? st.en : st.id, ps = document.querySelectorAll('#storyCard p');
    reading = true; document.getElementById('sRead').textContent = '⏸ ' + L('Berhenti', 'Stop');
    try{ speechSynthesis.cancel(); }catch(e){}
    var lang = EN ? 'en-US' : 'id-ID', vs = speechSynthesis.getVoices() || [];
    var v = (EN && window.BM_enVoice && window.BM_enVoice()) || vs.find(function(x){ return x.lang === lang && /female|Damayanti|Samantha|Karen|Google/i.test(x.name); }) || vs.find(function(x){ return x.lang && x.lang.indexOf(lang.slice(0,2)) === 0; }) || null;
    if (v && EN) lang = v.lang;
    var all = [st.t[EN ? 1 : 0] + '.'].concat(lines);
    all.forEach(function(text, i){
      var u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = EN ? .9 : .82; u.pitch = EN ? 1.05 : 1.3; if (v) u.voice = v;
      u.onstart = function(){ ps.forEach(function(p){ p.classList.remove('read'); }); if (i > 0 && ps[i-1]) ps[i-1].classList.add('read'); };
      if (i === all.length - 1) u.onend = u.onerror = function(){ if (reading) stopRead(); };
      speechSynthesis.speak(u);
    });
  }
  function openStory(){
    var st = tonight(), lines = EN ? st.en : st.id;
    document.getElementById('storyCard').innerHTML =
      '<span class="sem">'+IC.book+'</span><div class="sk">'+ic('book','dt-inl')+' '+L('Cerita malam ini', "Tonight's story")+'</div>'
      + '<h2>'+st.t[EN ? 1 : 0]+'</h2>'
      + lines.map(function(x){ return '<p>'+x+'</p>'; }).join('')
      + '<div class="lesson">'+ic('heart','dt-inl')+' '+st.l[EN ? 1 : 0]+'</div>'
      + '<div class="storybtns"><button id="sRead" type="button">🔊 '+L('Bacakan', 'Read aloud')+'</button><button class="sread" id="sClose" type="button">🌙 '+L('Selesai', 'Done')+'</button></div>';
    document.getElementById('sRead').addEventListener('click', function(){ vib(30); readAloud(); });
    document.getElementById('sClose').addEventListener('click', closeStory);
    document.getElementById('storySheet').classList.add('on');
  }
  function closeStory(){ stopRead(); document.getElementById('storySheet').classList.remove('on'); }
  document.getElementById('storySheet').addEventListener('click', function(e){ if (e.target.id === 'storySheet') closeStory(); });

  function renderHome(){
    var d = load();
    document.getElementById('homeMoon').innerHTML = moonHtml(d, false);
    document.getElementById('homeStoryT').textContent = L('Cerita malam ini: ', "Tonight's story: ") + tonight().t[EN ? 1 : 0];
  }
  document.getElementById('homeMoon').addEventListener('click', function(){ vib(30); openStory(); });
  document.getElementById('homeStory').addEventListener('click', function(){ vib(30); openStory(); });
  document.getElementById('btn-home').addEventListener('click', renderHome);

  var _startSleep = startSleep;
  startSleep = function(){
    _startSleep();
    var res = recordNight(), d = load(), box = document.getElementById('sleepExtra');
    box.innerHTML = (res.full ? '<div class="fullmoon">'+ic('fullmoon','dt-inl')+' '+L('Bulan purnama! 7 malam berturut-turut · +3', 'Full moon! 7 nights in a row · +3')+ic('star','dt-inl')+'</div>' : '')
      + '<button class="moonbox" type="button" id="sleepMoon">'+moonHtml(d, true)+'</button>'
      + '<button class="storychip" type="button" id="sleepStory" style="margin:0">'+ic('book','','width:22px;height:22px')+'<span>'+L('Dengar cerita malam ini', "Hear tonight's story")+'</span></button>';
    document.getElementById('sleepMoon').addEventListener('click', openStory);
    document.getElementById('sleepStory').addEventListener('click', openStory);
    renderHome();
  };
  // a page left open past midnight: refresh when it comes back
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) renderHome(); });
  window.BM_DREAM = { load:load, night:night, tonight:tonight, storyFor:storyFor, stories:STORIES.length }; /* read-only hook for tests */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderHome); else renderHome();
})();
</script>
